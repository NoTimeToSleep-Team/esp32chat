; PlatformIO config for M5Cardputer Client (ESP32-S3)
; Builds with test credentials for LC-Hub network

[env:m5cardputer_client]
platform = espressif32
board = m5stack-cores3
framework = arduino
monitor_speed = 115200
board_build.flash_mode = dio
board_build.f_cpu = 240000000
board_upload.flash_size = 8MB
board_build.flash_size = 8MB
board_build.partitions = default_8MB.csv

build_flags =
    -DLC_WIFI_SSID='"LC-Hub"'
    -DLC_WIFI_PASSWORD='"open"'
    -DLC_SERVER_BASE_URL='"http://192.168.4.1:18080"'
    -DLC_LOGIN='"device"'
    -DLC_PASSWORD='"devicepass"'
    -DLC_DEVICE_ID='"m5cardputer-client-l3"'
    -DLC_CLIENT_KIND='"device"'
    -DLC_CHAT_SEND_ENABLED=1
    -DLC_SUPPORT_CREATE_ENABLED=1

lib_deps =
    m5stack/M5Unified @ ^0.2.0
