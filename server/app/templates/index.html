<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#0e1621">
<title>Local Chat</title>
<link rel="stylesheet" href="/static/app.css?v=1789904300">
</head>
<body>
<div id="static-login" class="auth-wrap">
  <div class="auth-shell">
    <aside class="auth-brand">
      <div class="auth-logo">
        <span class="auth-mark">LC</span>
        <span class="auth-title">Local Chat</span>
      </div>
      <p class="auth-tagline" data-t="auth_tagline">Локальный чат в вашей сети</p>
      <ul class="auth-points">
        <li data-t="auth_point1">Работает без интернета</li>
        <li data-t="auth_point2">Телефон, ноутбук, устройства</li>
        <li data-t="auth_point3">Сообщения и файлы остаются внутри сети</li>
      </ul>
      <div class="auth-net"><span class="dot"></span><span>local-chat</span></div>
    </aside>
    <section class="auth-panel">
      <div class="auth-sub"><span id="static-subtitle" data-t="sign_in">Sign in</span><a href="#" class="lang-btn">🇬🇧 ENG</a></div>
      <form onsubmit="return false">
        <label class="auth-label" for="sl" data-t="field_login">Логин</label>
        <input id="sl" class="auth-input" data-t-placeholder="enter_login" placeholder="Login" autocomplete="username">
        <label class="auth-label" for="sp" data-t="field_pass">Пароль</label>
        <input id="sp" class="auth-input" data-t-placeholder="enter_pass" type="password" placeholder="Password" autocomplete="current-password">
        <label class="auth-label" for="sphone" id="sphone-label" data-t="field_phone" style="display:none">Телефон</label>
        <input id="sphone" class="auth-input" data-t-placeholder="phone" type="tel" style="display:none" placeholder="+79991234567" autocomplete="tel">
        <div id="serr" class="auth-error"></div>
        <button type="submit" id="sbtn" class="auth-btn" data-t="login_btn" onclick="staticSubmit()">Sign In</button>
      </form>
      <a href="#" id="stoggle" class="auth-link" onclick="toggleStaticMode();return false" data-t="register_link">No account? Register</a>
      <button onclick="doStaticGuest()" class="auth-guest" data-t="continue_guest">Continue as guest</button>
    </section>
  </div>
</div>


<nav class="nav" style="display:none">
    <a href="#/chat" class="nav-brand">LC</a>
    <button class="hamburger" id="hamburger">☰</button>
    <div class="nav-links" id="nav-links">
<a href="#/chat" data-t="chat">Chat</a>
<a href="#/devices" data-t="devices">Devices</a>
<a href="#/account" data-t="account">Account</a>
      <a href="#/blog" data-t="blog">Blog</a>
      <a href="#/support" data-t="support">Support</a>
      <a href="#/admin" id="admin-link" style="display:none" data-t="admin">Admin</a>
      <a href="/admin/network" id="network-link" style="display:none" data-t="network" target="_blank" rel="noopener">Network</a>
      <a href="#/about" data-public="true" data-t="about">О проекте</a>
      <div class="nav-right" id="nav-right">
        <button class="btn-logout lang-btn" style="margin-right:6px">🇬🇧 ENG</button>
        <span class="nav-user" id="nav-user"></span>
        <button class="btn-logout" id="logout-btn" data-t="logout">Logout</button>
      </div>
    </div>
  </nav>

<main class="main" id="content" style="display:none">
  <noscript>
    <div class="login-page">
      <div class="login-card">
        <div class="login-title">Local Chat</div>
        <div class="login-subtitle">JavaScript required. Please open this page in a regular browser, or enable JS.</div>
        <p style="color:var(--text2);margin-top:12px">Use <strong>http://192.168.4.1:18080/</strong> in Chrome/Safari</p>
      </div>
    </div>
  </noscript>
</main>

<script src="/static/app.js?v=1789904300"></script>

<script>
var _st = localStorage.getItem("lc_session_token");
if (_st) {
  document.getElementById("static-login").style.display = "none"; document.getElementById("content").style.display = "";
  document.querySelector(".nav").style.display = "";
  document.getElementById("nav-right").style.display = "";
  try { var u = JSON.parse(localStorage.getItem("lc_user")||"{}"); document.getElementById("nav-user").textContent = u.login||""; } catch(e) {}
}

function onStaticLoginSuccess(d) {
  localStorage.setItem("lc_session_token", d.session.token);
  localStorage.setItem("lc_user", JSON.stringify(d.user));
  document.getElementById("static-login").style.display = "none"; document.getElementById("content").style.display = "";
  document.querySelector(".nav").style.display = "";
  document.getElementById("nav-user").textContent = d.user.login;
  document.getElementById("nav-right").style.display = "";
  // Replace the login entry: otherwise the back gesture returns to the login page.
  try { history.replaceState(null, "", "#/chat"); } catch (e) {}
  if (window.lcStaticLoginComplete) {
    window.lcStaticLoginComplete();
  } else {
    var s = document.createElement("script"); s.src = "/static/app.js"; document.body.appendChild(s);
  }
}

var staticMode = "login";
function staticErrText(d, status) {
  if (d && d.detail) {
    if (Array.isArray(d.detail) && d.detail.length) { var f = d.detail[0] || {}; return (f.msg || "validation error"); }
    if (typeof d.detail === "object" && d.detail !== null) return d.detail.message || d.detail.code || ("HTTP " + status);
    if (typeof d.detail === "string") return d.detail;
  }
  return "HTTP " + status;
}
function toggleStaticMode() {
  staticMode = staticMode === "login" ? "register" : "login";
  var isReg = staticMode === "register";
  document.getElementById("sphone").style.display = isReg ? "block" : "none";
  var sphLbl = document.getElementById("sphone-label");
  if (sphLbl) sphLbl.style.display = isReg ? "block" : "none";
  document.getElementById("sbtn").setAttribute("data-t", isReg ? "create_account" : "login_btn");
  document.getElementById("stoggle").setAttribute("data-t", isReg ? "login_link" : "register_link");
  document.getElementById("static-subtitle").setAttribute("data-t", isReg ? "create_account" : "sign_in");
  var err = document.getElementById("serr"); err.textContent = ""; err.style.display = "none";
  if (window.applyLang) applyLang();
}
function staticValidate() {
  var l = document.getElementById("sl").value.trim();
  var p = document.getElementById("sp").value;
  var ph = document.getElementById("sphone").value.trim();
  var e = document.getElementById("serr");
  if (!l || !p) { e.textContent = (typeof t === "function") ? t("enter_login_pass") : "Enter login and password"; e.style.display = "block"; return null; }
  if (staticMode === "register") {
    if (p.length < 8) { e.textContent = (typeof t === "function") ? t("min_8_chars") : "Min 8 characters"; e.style.display = "block"; return null; }
    if (ph) {
      var clean = ph.replace(/[^0-9+]/g, "");
      if (!/^\+?[0-9]{10,15}$/.test(clean)) { e.textContent = "Invalid phone number: use 10-15 digits, e.g. +79991234567"; e.style.display = "block"; return null; }
    }
  }
  e.style.display = "none";
  return { login: l, pass: p, phone: ph };
}
async function staticSubmit() {
  var v = staticValidate();
  if (!v) return;
  var isReg = staticMode === "register";
  var url = isReg ? "/auth/register" : "/auth/login";
  var payload = isReg
    ? { login: v.login, password: v.pass, phone: v.phone || "No Phone", device_id: "web-" + Date.now().toString(36), client_kind: "web" }
    : { login: v.login, password: v.pass, client_kind: "web" };
  var btn = document.getElementById("sbtn"); btn.disabled = true;
  var tr = (isReg ? "reg-" : "login-") + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 7);
  var t1 = Date.now();
  try {
    var r = await fetch(url, {method:"POST",headers:{"Content-Type":"application/json","X-Debug-Trace":tr},body:JSON.stringify(payload)});
    var t2 = Date.now();
    var d = await r.json().catch(function(){return{}});
    if (!r.ok) {
      var msg = staticErrText(d, r.status);
      if (window.lcDebugReport) window.lcDebugReport({trace_id:tr, action:url, method:"POST", ok:false, status:r.status, stages_done:2, error:msg, t1_ms:t1, t2_ms:t2, t3_ms:Date.now()});
      throw new Error(msg);
    }
    if (window.lcDebugReport) window.lcDebugReport({trace_id:tr, action:url, method:"POST", ok:true, status:r.status, stages_done:3, t1_ms:t1, t2_ms:t2, t3_ms:Date.now()});
    onStaticLoginSuccess(d);
  } catch(x) {
    if (x.name === "TypeError" && window.lcDebugReport) window.lcDebugReport({trace_id:tr, action:url, method:"POST", ok:false, stages_done:1, error:"Server unreachable", t1_ms:t1, t3_ms:Date.now()});
    var e = document.getElementById("serr");
    e.textContent = x.message; e.style.display = "block";
  } finally {
    btn.disabled = false;
  }
}
function doStaticLogin() { return staticSubmit(); }

async function doStaticGuest() {
  var e = document.getElementById("serr");
  var tr = "guest-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 7);
  var t1 = Date.now();
  try {
    var r = await fetch("/auth/guest", {method:"POST",headers:{"Content-Type":"application/json","X-Debug-Trace":tr},body:JSON.stringify({client_kind:"web"})});
    var t2 = Date.now();
    var d = await r.json();
    if (!r.ok) {
      if (window.lcDebugReport) window.lcDebugReport({trace_id:tr, action:"/auth/guest", method:"POST", ok:false, status:r.status, stages_done:2, error:(d.detail?.message||("HTTP "+r.status)), t1_ms:t1, t2_ms:t2, t3_ms:Date.now()});
      throw new Error(d.detail?.message||"HTTP "+r.status);
    }
    if (window.lcDebugReport) window.lcDebugReport({trace_id:tr, action:"/auth/guest", method:"POST", ok:true, status:r.status, stages_done:3, t1_ms:t1, t2_ms:t2, t3_ms:Date.now()});
    onStaticLoginSuccess(d);
  } catch(x) {
    if (x.name === "TypeError" && window.lcDebugReport) window.lcDebugReport({trace_id:tr, action:"/auth/guest", method:"POST", ok:false, stages_done:1, error:"Server unreachable", t1_ms:t1, t3_ms:Date.now()});
    if (e) { e.textContent = x.message; e.style.display = "block"; }
  }
}
</script>
</body>
</html>
