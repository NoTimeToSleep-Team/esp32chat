<!DOCTYPE html><html><head><meta charset="UTF-8"><title>LC Debug</title>
<style>body{font:14px monospace;background:#0d1117;color:#e6edf3;padding:20px}
input,button{padding:8px;border-radius:4px;border:1px solid #30363d;background:#161b22;color:#e6edf3;margin:4px}
button{cursor:pointer;background:#238636;border:none}.ok{color:#238636}.err{color:#f85149}
table{border-collapse:collapse;width:100%;margin:10px 0}
td,th{padding:6px 8px;border:1px solid #30363d}</style></head><body>
<h2>LC Debug</h2>
<div id="login">
  <input id="l" placeholder="login" value="admin"><input id="p" type="password" placeholder="password" value="7428">
  <button onclick="doLogin()">Login</button>
</div>
<div id="status"></div>
<div id="users"></div>
<script>
var ST = localStorage.getItem('lc_session_token') || '';
if (ST) { document.getElementById('login').innerHTML = '<span class=ok>Logged in</span> <button onclick="ST=\'\';localStorage.clear();location.reload()">Logout</button>'; }

async function doLogin() {
  var el = document.getElementById('status');
  el.innerHTML = 'Logging in...';
  try {
    var r = await fetch('/auth/login', {method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({login:document.getElementById('l').value,password:document.getElementById('p').value,client_kind:'web'})});
    var d = await r.json();
    if (!r.ok) throw new Error(d.detail?.message||'HTTP '+r.status);
    ST = d.session.token;
    localStorage.setItem('lc_session_token', ST);
    localStorage.setItem('lc_user', JSON.stringify(d.user));
    location.reload();
  } catch(e) { el.innerHTML = '<span class=err>Login FAILED: '+e.message+'</span>'; }
}

async function load() {
  if (!ST) { document.getElementById('status').innerHTML = 'Login first'; return; }
  try {
    var d = await (await fetch('/admin/users?session_token='+ST+'&_='+Date.now())).json();
    if (!d.items) throw new Error('No items in response');
    var h = '<table><tr><th>ID</th><th>Login</th><th>Role</th><th>Actions</th></tr>';
    d.items.forEach(function(u) {
      h += '<tr><td>'+u.user_id+'</td><td>'+u.login+'</td><td>'+u.role+'</td><td>';
      h += '<button onclick="act('+u.user_id+',\'setrole\',\''+(u.role==='moderator'?'user':'moderator')+'\')">'+(u.role==='moderator'?'Demote':'Promote')+'</button> ';
      h += '<button onclick="act('+u.user_id+',\'ban\')">Ban</button> ';
      h += '<button onclick="del('+u.user_id+',\''+u.login+'\')">Delete</button>';
      h += '</td></tr>';
    });
    h += '</table>';
    document.getElementById('users').innerHTML = h;
    document.getElementById('status').innerHTML = '<span class=ok>'+d.items.length+' users</span>';
  } catch(e) { document.getElementById('status').innerHTML = '<span class=err>'+e.message+'</span>'; }
}

async function act(uid, action, role) {
  var s = document.getElementById('status'); s.textContent = '...';
  try {
    var body = {session_token:ST}; if (role) body.role = role;
    await fetch('/admin/users/'+uid+'/'+action, {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    s.innerHTML = '<span class=ok>'+action+' OK</span>'; load();
  } catch(e) { s.innerHTML = '<span class=err>'+e.message+'</span>'; }
}

async function del(uid, login) {
  if (!confirm('Delete '+login+'?')) return;
  var s = document.getElementById('status'); s.textContent = '...';
  try {
    await fetch('/admin/users/'+uid+'?session_token='+ST, {method:'DELETE'});
    s.innerHTML = '<span class=ok>Deleted</span>'; load();
  } catch(e) { s.innerHTML = '<span class=err>'+e.message+'</span>'; }
}

load();
</script></body></html>
