<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>LC Admin</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0e1621;--bg2:#17212b;--bg3:#1d2a36;--border:#24313d;
  --text:#f1f5f9;--text2:#7f8b98;--accent:#5eb5f7;--ok:#4fb286;--warn:#d29922;--danger:#f85149;
  --radius:12px;
}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font:13px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Oxygen,Ubuntu,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
a{color:var(--accent);text-decoration:none}
.top{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:10px;padding:10px 14px;background:rgba(23,33,43,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
.brand{font-size:15px;font-weight:800;color:var(--accent);letter-spacing:.4px;white-space:nowrap}
.top .spacer{flex:1}
.pill{font-size:11px;padding:3px 10px;border-radius:999px;background:var(--bg3);color:var(--text2);white-space:nowrap}
.pill-warn{background:rgba(210,153,34,.18);color:var(--warn)}
.pill-ok{background:rgba(79,178,134,.16);color:var(--ok)}
.pill-err{background:rgba(248,81,73,.18);color:var(--danger)}
.wrap{max-width:1080px;margin:0 auto;padding:14px}
h2{color:var(--accent);margin:0 0 8px;font-size:18px}
h3{margin:0 0 10px;color:var(--text);font-size:15px;font-weight:600}
h4{margin:8px 0 4px;font-size:13px}
input,select,textarea,button{padding:8px 11px;border-radius:10px;border:1px solid var(--border);background:var(--bg3);color:var(--text);font:13px inherit;font-family:inherit;margin:2px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(94,181,247,.15)}
input[type=number]{text-align:center}
button{cursor:pointer;border:none;font-weight:600;transition:.15s}
button:hover{filter:brightness(1.12)}
button:active{transform:translateY(1px)}
.btn-danger{background:var(--danger);color:#fff}
.btn-outline{background:var(--bg3);color:var(--text);border:1px solid var(--border)}
.btn-green{background:#2f9e6b;color:#fff}
.btn-warn{background:var(--warn);color:#10161d}
.btn-logout{padding:7px 14px;border-radius:10px;border:1px solid var(--border);background:transparent;color:var(--text2);font-size:12.5px}
.btn-logout:hover{background:var(--danger);color:#fff;border-color:var(--danger)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 12px;margin:0;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:7px 14px;background:var(--bg2);border:1px solid var(--border);border-radius:999px;cursor:pointer;color:var(--text2);font-size:13px;white-space:nowrap;flex:0 0 auto;transition:.15s}
.tab:hover{color:var(--text)}
.tab.active{background:rgba(94,181,247,.16);color:var(--accent);border-color:rgba(94,181,247,.4);font-weight:600}
.panel{display:none}.panel.active{display:block}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.card .card{background:var(--bg3);margin-bottom:10px}
.card.mini{padding:10px 14px}
table{width:100%;border-collapse:collapse;margin:6px 0;font-size:12.5px}
td,th{padding:7px 9px;border-bottom:1px solid var(--border);text-align:left;vertical-align:middle}
th{color:var(--text2);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.4px}
tr:last-child td{border-bottom:none}
.tbl{overflow-x:auto;-webkit-overflow-scrolling:touch}
#msg{color:var(--accent);margin:0 0 10px;font-size:12.5px;min-height:18px}
#login{margin-bottom:14px}
.login-card{max-width:440px}
.login-card form{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.login-card input{flex:1 1 150px;min-width:0;margin:0}
#loginMsg{font-size:12px;color:var(--accent);margin-top:8px;min-height:16px}
.who{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--text2)}
.who b{color:var(--text)}
.stat{text-align:center;padding:10px 14px;background:var(--bg3);border-radius:10px;min-width:96px}
.stat .n{font-size:20px;font-weight:700}
.stat .l{font-size:11px;color:var(--text2)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.acts button,.acts input{margin:0}
.ava{width:44px;height:44px;border-radius:50%;object-fit:cover;background:var(--bg3);display:inline-flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:var(--accent)}
.ic{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-2px}
#debug-log table{font-size:11px}
@media(max-width:700px){
  .wrap{padding:10px}
  .card{padding:13px;border-radius:10px}
  h3{font-size:14px}
  .top{padding:9px 11px}
  .brand{font-size:14px}
  td,th{padding:6px 7px}
  .tbl-stack{display:block}
  .tbl-stack thead{display:none}
  .tbl-stack tr{display:block;background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:8px 10px;margin-bottom:8px}
  .tbl-stack td{display:flex;justify-content:space-between;gap:10px;border:none;padding:3px 0;white-space:normal}
  .tbl-stack td::before{content:attr(data-label);color:var(--text2);font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;flex:0 0 auto;padding-top:2px}
  .tbl-stack td:last-child{justify-content:flex-start;flex-wrap:wrap}
  .tbl-stack td:last-child::before{display:none}
}
</style></head><body>
<header class="top">
  <div class="brand">LC Admin</div>
  <span class="spacer"></span>
  <span id="js-status" class="pill pill-warn">JS checking…</span>
</header>
<div class="wrap">
  <div id="login" class="card login-card">
    <h3>Admin login</h3>
    <form onsubmit="doLogin();return false">
      <input id="l" placeholder="admin login" autocomplete="username">
      <input id="p" type="password" placeholder="admin password" autocomplete="current-password">
      <button type="submit" class="btn-green">Login</button>
    </form>
    <div id="loginMsg"></div>
  </div>
  <div id="main" style="display:none"><div id="msg"></div>
  <div class="tabs" id="tabs"><div class="tab active" onclick="switchTab('users')">Users</div><div class="tab" onclick="switchTab('cleanup')">Cleanup</div><div class="tab" onclick="switchTab('system')">System</div><div class="tab" onclick="switchTab('passwords')">Passwords</div><div class="tab" onclick="switchTab('support')">Support</div><div class="tab" onclick="switchTab('mode')">Mode</div><div class="tab" onclick="switchTab('activity')">Activity</div><div class="tab" onclick="switchTab('reports')">Reports</div>
  <div class="tab" onclick="switchTab('profile')">Profile</div></div>
<div id="panel-users" class="panel active"></div><div id="panel-cleanup" class="panel"></div><div id="panel-system" class="panel"></div><div id="panel-passwords" class="panel"></div><div id="panel-support" class="panel"></div><div id="panel-mode" class="panel"></div><div id="panel-activity" class="panel"></div><div id="panel-reports" class="panel"></div>
<div id="panel-profile" class="panel"></div></div>
</div>
<script>
var ST = "";
var ADMIN_TOKEN_KEY = "lc_admin_token", ADMIN_USER_KEY = "lc_admin_user";
function jsStatus(text, cls) {
  var el = document.getElementById("js-status");
  if (!el) return;
  el.textContent = text;
  el.className = "pill " + (cls || "");
}
jsStatus("JS loaded", "pill-ok");
setTimeout(function() { var el = document.getElementById("js-status"); if (el) el.style.display = "none"; }, 1500);
window.onerror = function(m,u,l) {
  var el = document.getElementById("js-status");
  if (el) el.style.display = "";
  jsStatus("JS ERROR line " + l + ": " + m, "pill-err");
};


var _msgTimer = null;
function msg(t) { var m = document.getElementById("msg"); if (!m) return; m.innerHTML = t || ""; if (_msgTimer) clearTimeout(_msgTimer); _msgTimer = setTimeout(function() { m.innerHTML = ""; }, 5000); }
function esc(s) { var d = document.createElement("div"); d.textContent = s || ""; return d.innerHTML; }
function icon(name) {
  var paths = {
    clip: "<path d='M8.5 12.5l6-6a2.6 2.6 0 0 1 3.7 3.7l-7.3 7.3a4.3 4.3 0 0 1-6.1-6.1l7-7'/>",
    save: "<path d='M5 3.5h10.5L19 7v13.5H5z'/><path d='M8.5 3.5v5.5h6V3.5'/><path d='M8.5 20.5v-6h7v6'/>",
    user: "<circle cx='12' cy='8.5' r='3.5'/><path d='M5 19.5c1.2-3.2 3.8-5 7-5s5.8 1.8 7 5'/>"
  };
  return "<svg class='ic' viewBox='0 0 24 24' aria-hidden='true'>" + (paths[name] || "") + "</svg>";
}
// Photo avatar when the user has one, initials otherwise.
function avatarHtml(profile, size) {
  var s = size || 44;
  if (profile && profile.avatar_url) return '<img class="ava" style="width:' + s + 'px;height:' + s + 'px" src="' + profile.avatar_url + '" alt="">';
  var name = (profile && (profile.display_name || profile.login)) || "?";
  var initials = name.trim().slice(0, 2).toUpperCase();
  return '<span class="ava" style="width:' + s + 'px;height:' + s + 'px">' + esc(initials) + "</span>";
}
// Wrap every table into a scroll container and label cells for the mobile card layout.
function enhanceTables(root) {
  var scope = root && root.querySelectorAll ? root : document;
  var tables = scope.querySelectorAll("table:not([data-enhanced])");
  for (var i = 0; i < tables.length; i++) {
    var t = tables[i];
    t.setAttribute("data-enhanced", "1");
    var head = t.querySelector("tr");
    var labels = [];
    if (head) {
      var ths = head.children;
      var onlyTh = ths.length > 0;
      for (var j = 0; j < ths.length; j++) {
        labels.push((ths[j].textContent || "").trim());
        if (ths[j].tagName !== "TH") onlyTh = false;
      }
      // Keep header cells in a real thead so the mobile card layout can hide them.
      if (onlyTh && t.querySelector("thead") === null) {
        var thead = document.createElement("thead");
        thead.appendChild(head);
        t.insertBefore(thead, t.firstChild);
      }
    }
    var rows = t.querySelectorAll("tr");
    for (var r = 0; r < rows.length; r++) {
      var tds = rows[r].children;
      for (var c = 0; c < tds.length; c++) {
        if (tds[c].tagName === "TD" && labels[c]) tds[c].setAttribute("data-label", labels[c]);
      }
    }
    if (t.parentNode && t.parentNode.className !== "tbl") {
      var wrap = document.createElement("div");
      wrap.className = "tbl";
      t.parentNode.insertBefore(wrap, t);
      wrap.appendChild(t);
    }
  }
}
new MutationObserver(function(muts) {
  for (var i = 0; i < muts.length; i++) {
    var added = muts[i].addedNodes;
    for (var j = 0; j < added.length; j++) {
      if (added[j].nodeType === 1) enhanceTables(added[j]);
    }
  }
}).observe(document.body, { childList: true, subtree: true });
function attachmentUrl(a) {
  var base = a.download_url || ("/media/api/attachments/" + a.attachment_id + "/download");
  return base + (base.indexOf("?") >= 0 ? "&" : "?") + "session_token=" + encodeURIComponent(ST);
}
function attachmentsHtml(items) {
  if (!items || !items.length) return "";
  var h = '<div style="display:flex;flex-wrap:wrap;gap:6px;margin:6px 0">';
  items.forEach(function(a) {
    var url = attachmentUrl(a);
    var name = esc(a.filename || ("attachment-" + a.attachment_id));
    if (a.media_kind === "image") {
      h += '<img src="' + url + '" alt="' + name + '" title="' + name + '" style="max-width:140px;max-height:120px;border-radius:6px;border:1px solid #24313d;cursor:zoom-in" onclick="openImg(this.src)">';
    } else {
      h += '<a href="' + url + '" target="_blank" rel="noopener" style="color:#5eb5f7;font-size:12px;border:1px solid #24313d;border-radius:8px;padding:5px 9px;text-decoration:none">' + icon("clip") + " " + name + "</a>";
    }
  });
  return h + "</div>";
}
function openImg(src) {
  var o = document.getElementById("img-overlay");
  if (!o) {
    o = document.createElement("div");
    o.id = "img-overlay";
    o.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:99999;display:flex;align-items:center;justify-content:center;cursor:zoom-out";
    o.innerHTML = '<button id="io-close" style="position:absolute;top:16px;right:16px;background:#24313d;color:#f1f5f9;border:none;width:38px;height:38px;border-radius:50%;font-size:16px;cursor:pointer">\u2715</button>' +
      '<button id="io-prev" style="position:absolute;left:12px;top:50%;transform:translateY(-50%);background:rgba(48,54,61,.85);color:#f1f5f9;border:none;width:44px;height:64px;font-size:30px;cursor:pointer;border-radius:8px">\u2039</button>' +
      '<img style="max-width:92vw;max-height:88vh;border-radius:8px">' +
      '<button id="io-next" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:rgba(48,54,61,.85);color:#f1f5f9;border:none;width:44px;height:64px;font-size:30px;cursor:pointer;border-radius:8px">\u203a</button>' +
      '<div id="io-counter" style="position:absolute;bottom:18px;color:#7f8b98;font-size:12px"></div>';
    document.body.appendChild(o);
    o.onclick = function(e) { if (e.target === o || e.target.id === "io-close") o.remove(); };
    o.querySelector("#io-prev").onclick = function(e) { e.stopPropagation(); stepImg(-1); };
    o.querySelector("#io-next").onclick = function(e) { e.stopPropagation(); stepImg(1); };
    var touchX = null;
    o.addEventListener("touchstart", function(e) { touchX = e.changedTouches[0].clientX; }, { passive: true });
    o.addEventListener("touchend", function(e) {
      if (touchX === null) return;
      var dx = e.changedTouches[0].clientX - touchX;
      touchX = null;
      if (Math.abs(dx) > 40) stepImg(dx < 0 ? 1 : -1);
    }, { passive: true });
  }
  var imgs = Array.prototype.slice.call(document.querySelectorAll('img[onclick^="openImg"]'));
  window.__imgs = imgs.map(function(i) { return i.src; });
  if (!window.__imgs.length) window.__imgs = [src];
  window.__imgIdx = Math.max(0, window.__imgs.indexOf(src));
  showImg();
}
function showImg() {
  var o = document.getElementById("img-overlay");
  if (!o) return;
  o.querySelector("img").src = window.__imgs[window.__imgIdx];
  var counter = document.getElementById("io-counter");
  var multi = window.__imgs.length > 1;
  if (counter) counter.textContent = multi ? (window.__imgIdx + 1) + " / " + window.__imgs.length : "";
  var prev = document.getElementById("io-prev"), next = document.getElementById("io-next");
  if (prev) prev.style.display = multi ? "" : "none";
  if (next) next.style.display = multi ? "" : "none";
}
function stepImg(d) {
  if (!window.__imgs || window.__imgs.length < 2) return;
  window.__imgIdx = (window.__imgIdx + d + window.__imgs.length) % window.__imgs.length;
  showImg();
}
async function uploadFile(file) {
  var fd = new FormData();
  fd.append("file", file);
  var r = await fetch("/media/api/attachments?session_token=" + encodeURIComponent(ST), { method: "POST", body: fd });
  var d = await r.json().catch(function() { return {}; });
  if (!r.ok) throw new Error((d.detail && (d.detail.message || d.detail.code)) || ("Upload failed (" + r.status + ")"));
  return d.attachment;
}
function dbgReport(payload) {
  try { if (ST) payload.session_token = ST; fetch("/debug/api/client-event", {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)}).catch(function(){}); } catch(e) {}
}
function newTraceId(prefix) { return (prefix||"ad") + "-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2,7); }

async function doLogin() {
  var m = document.getElementById("loginMsg"); m.textContent = "...";
  var login = document.getElementById("l").value.trim();
  var pass = document.getElementById("p").value.trim();
  if (!login || !pass) { m.textContent = "Enter login and password"; return; }
  var tr = newTraceId("ad-login");
  var t1 = Date.now();
  try {
    var r = await fetch("/auth/login", {method:"POST",headers:{"Content-Type":"application/json","X-Debug-Trace":tr},body:JSON.stringify({login:login,password:pass,client_kind:"web"})});
    var t2 = Date.now();
    var d = await r.json();
    if (!r.ok) {
      dbgReport({trace_id:tr, action:"/auth/login", method:"POST", ok:false, status:r.status, stages_done:2, error:(d.detail ? d.detail.message : ("HTTP "+r.status)), t1_ms:t1, t2_ms:t2, t3_ms:Date.now()});
      throw new Error(d.detail ? d.detail.message : "HTTP " + r.status);
    }
    dbgReport({trace_id:tr, action:"/auth/login", method:"POST", ok:true, status:r.status, stages_done:3, t1_ms:t1, t2_ms:t2, t3_ms:Date.now()});
    if (d.user.role !== "admin" && d.user.role !== "moderator") { m.textContent = "Admin access only"; m.style.color = "#f85149"; return; }
    ST = d.session.token;
    localStorage.setItem(ADMIN_TOKEN_KEY, ST);
    localStorage.setItem(ADMIN_USER_KEY, JSON.stringify(d.user));
    m.textContent = "OK"; m.style.color = "#4fb286";
    showMain();
  } catch(e) {
    if (e.name === "TypeError") dbgReport({trace_id:tr, action:"/auth/login", method:"POST", ok:false, stages_done:1, error:"Server unreachable", t1_ms:t1, t3_ms:Date.now()});
    m.textContent = e.message;
    m.style.color = "#f85149";
  }
}

function doLogout() {
  ST = "";
  localStorage.removeItem(ADMIN_TOKEN_KEY);
  localStorage.removeItem(ADMIN_USER_KEY);
  location.reload();
}

// Restore a previous admin session on reload (the app session is kept separate).
async function restoreSession() {
  var tok = localStorage.getItem(ADMIN_TOKEN_KEY);
  if (!tok) return;
  ST = tok;
  try {
    var d = await apiCall("/account/api/profile?session_token=" + encodeURIComponent(ST));
    showMain(d.profile);
  } catch(e) {
    ST = "";
    localStorage.removeItem(ADMIN_TOKEN_KEY);
    localStorage.removeItem(ADMIN_USER_KEY);
  }
}

function showMain(profile) {
  var me = profile || {};
  if (!me.login) {
    try { me = JSON.parse(localStorage.getItem(ADMIN_USER_KEY) || "{}"); } catch(e) { me = {}; }
  }
  var loginBox = document.getElementById("login");
  loginBox.className = "card mini";
  loginBox.innerHTML = '<div class="who">' + avatarHtml(me, 34) + '<span>Logged in as <b>' + esc(me.login || "") + '</b></span><span class="spacer" style="flex:1"></span><button class="btn-logout" onclick="doLogout()">Logout</button></div>';
  document.getElementById("main").style.display = "block";
  if (me.role !== "admin") {
    var keep = ["Users", "Reports", "Profile"];
    document.querySelectorAll(".tab").forEach(function(t) {
      if (keep.indexOf(t.textContent.trim()) === -1) t.style.display = "none";
    });
  }
  switchTab("users");
}

function switchTab(t) {
  var tab = document.querySelector(".tab[onclick*='" + t + "']");
  if (!tab) return;
  document.querySelectorAll(".tab").forEach(function(x) { x.classList.remove("active"); });
  tab.classList.add("active");
  try { tab.scrollIntoView({ inline: "center", block: "nearest" }); } catch(e) {}
  document.querySelectorAll(".panel").forEach(function(x) { x.classList.remove("active"); });
  document.getElementById("panel-" + t).classList.add("active");
  if (t === "users") loadUsers();
  if (t === "support") loadSupport();
  if (t === "system") loadSystem();
  if (t === "passwords") loadPasswords();
  if (t === "mode") loadMode();
  if (t === "activity") loadActivity();
  if (t === "reports") loadReports();
  if (t === "profile") loadProfile();
}

async function apiCall(url, method, body) {
  var opts = { method: method || "GET", headers: { "Content-Type": "application/json" } };
  if (body) opts.body = JSON.stringify(body);
  var tr = newTraceId("ad");
  opts.headers["X-Debug-Trace"] = tr;
  var t1 = Date.now();
  try {
    var r = await fetch(url, opts);
    var t2 = Date.now();
    var d = await r.json().catch(function(){return{}});
    if (!r.ok) {
      var emsg = d.detail ? d.detail.message : ("HTTP " + r.status);
      dbgReport({trace_id:tr, action:url, method:opts.method, ok:false, status:r.status, stages_done:2, error:emsg, t1_ms:t1, t2_ms:t2, t3_ms:Date.now()});
      throw new Error(emsg);
    }
    dbgReport({trace_id:tr, action:url, method:opts.method, ok:true, status:r.status, stages_done:3, t1_ms:t1, t2_ms:t2, t3_ms:Date.now()});
    return d;
  } catch(e) {
    if (e.name === "TypeError") {
      dbgReport({trace_id:tr, action:url, method:opts.method, ok:false, stages_done:1, error:"Server unreachable", t1_ms:t1, t3_ms:Date.now()});
      throw new Error("Server unreachable");
    }
    throw e;
  }
}

// USERS
async function loadUsers() {
  var p = document.getElementById("panel-users");
  p.innerHTML = '<div class="card">Loading...</div>';
  var meRole = "user";
  try { meRole = JSON.parse(localStorage.getItem(ADMIN_USER_KEY) || "{}").role || "user"; } catch(e) {}
  var isFullAdmin = meRole === "admin";
  try {
    var d = await apiCall("/admin/users?session_token=" + ST + "&_=" + Date.now());
    var h = '<div class="card"><h3>Users (' + d.count + ')</h3><table class="tbl-stack"><tr><th>ID</th><th>Login</th><th>Role</th><th>Status</th><th>Actions</th></tr>';
    d.items.forEach(function(u) {
      h += "<tr><td>" + u.user_id + "</td><td>" + esc(u.login) + "</td><td>" + u.role + "</td><td>" + u.status + '</td><td><span class="acts">';
      if (u.status === "active") {
        h += '<button class="btn-outline" onclick="userAction(' + u.user_id + ',\'setrole\',\'' + (u.role === "moderator" ? "user" : "moderator") + '\')">' + (u.role === "moderator" ? "Demote" : "Promote") + '</button>';
        h += '<button class="btn-danger" onclick="userAction(' + u.user_id + ',\'ban\')">Ban</button>';

async function tblk(uid) {

    await apiCall("/admin/users/" + uid + "/temporary-block", "POST", { session_token: ST, duration_minutes: dur });

    loadUsers();
  } catch(e) { msg('<span style="color:#f85149">' + e.message + "</span>"); }
}

async function loadReports() {
  var p = document.getElementById("panel-reports");

  var h = '<div class="card"><h3>User Reports <span style="color:#f85149">(' + (user.pending_count||0) + ' pending)</span></h3>';
  if (userErr) { h += '<p style="color:#f85149">' + esc(userErr) + '</p>'; }
  else if (!user.reports || !user.reports.length) { h += '<p style="color:#7f8b98">No reports</p>'; }

      h += "</div>";
      if (r.comment) h += '<div style="font-size:12px;background:#0e1621;padding:6px;border-radius:4px;margin:4px 0;white-space:pre-wrap">' + esc(r.comment) + "</div>";
      if (r.attachments && r.attachments.length) h += attachmentsHtml(r.attachments);
      if (r.status === "pending") {
        h += '<div style="margin-top:6px"><button class="btn-danger" onclick="resolveUserReport(' + r.id + ',\'ban\')">Ban</button> <button class="btn-warn" onclick="resolveUserReport(' + r.id + ',\'warn\')">Warn (' + (r.target_warn_count || 0) + '/3)</button> <button class="btn-outline" onclick="resolveUserReport(' + r.id + ',\'dismiss\')">Dismiss</button> <button class="btn-outline" onclick="toggleTargetMessages(' + r.id + ',' + r.target_user_id + ')">Messages</button></div>';

        h += '<div style="font-size:11px;color:#7f8b98">Resolved: ' + esc(r.action || "?") + " by " + esc(r.resolved_by || "?") + "</div>";
      }
      h += '<div id="uevidence-' + r.id + '" style="display:none;margin-top:8px;background:#0e1621;border:1px solid #24313d;border-radius:6px;padding:8px"></div>';
      h += "</div>";
    });
  }
  h += "</div>";

  h += '<div class="card"><h3>Auto-Moderation <span style="color:#f85149">(' + (auto.pending_count||0) + ' pending)</span></h3>';
  if (autoErr) { h += '<p style="color:#f85149">' + esc(autoErr) + '</p>'; }

  else {
    auto.reports.forEach(function(r) {
      var sc = r.status === "pending" ? "#d29922" : "#7f8b98";
      h += '<div class="card" style="border-left:3px solid ' + sc + '"><div style="display:flex;justify-content:space-between"><strong>' + esc(r.user_login) + '</strong><span style="font-size:11px;color:#7f8b98">#' + r.id + " " + r.status + "</span></div>";

async function resolveUserReport(rid, action) {
  if (action === "ban" && !confirm("Ban the user from this report?")) return;
  msg("Working...");
  try {
    var d = await apiCall("/reports/api/resolve", "POST", { session_token: ST, report_id: rid, action: action });
    if (action === "warn" && d.warn) {
      if (d.warn.banned) msg('<span style="color:#f85149">Warn 3/3 \u2014 user banned for 3 days</span>');
      else msg('<span style="color:#d29922">Warn ' + d.warn.warn_count + '/' + d.warn.max_warns + '</span>');
    } else {
      msg('<span style="color:#4fb286">Report ' + action + "</span>");
    }
    loadReports();
  } catch(e) { msg('<span style="color:#f85149">' + e.message + "</span>"); }
}

    var h = '<div class="card" style="max-width:520px">';
    h += '<div style="text-align:center;margin-bottom:8px">' + avatarHtml(pr, 72) + '</div>';
    h += '<h3 style="text-align:center">' + esc(pr.display_name || pr.login) + '</h3>';
    h += '<div style="text-align:center;color:#7f8b98;margin-bottom:12px">@' + esc(pr.login) + ' · ' + pr.role + '</div>';
    h += '<table><tr><th>Display Name</th><td>' + esc(pr.display_name || '-') + '</td></tr>';
    h += '<tr><th>Role</th><td>' + pr.role + '</td></tr>';
    h += '<tr><th>Status</th><td>' + pr.status + '</td></tr>';
    if (pr.phone) h += '<tr><th>Phone</th><td>' + esc(pr.phone) + '</td></tr>';
    h += '</table>';
    if (pr.profile_bio) h += '<div class="card" style="margin-top:8px"><h4>Bio</h4><p style="white-space:pre-wrap">' + esc(pr.profile_bio) + '</p></div>';
    h += '</div>';
    
    // Поиск другого пользователя
    h += '<div class="card" style="max-width:520px"><h3>Lookup User</h3>';
    h += '<div class="row"><input id="lookup-login" placeholder="User login" style="flex:1 1 160px;min-width:0">';
    h += '<button class="btn-outline" onclick="lookupProfile()">View</button></div>';
    h += '<div id="lookup-result" style="margin-top:8px"></div></div>';
    
    p.innerHTML = h;
  } catch(e) { p.innerHTML = '<div class="card" style="color:#f85149">' + e.message + '</div>'; }
}

async function lookupProfile() {
  var login = document.getElementById('lookup-login').value.trim();
  if (!login) { document.getElementById('lookup-result').textContent = 'Enter a login'; return; }
  document.getElementById('lookup-result').innerHTML = 'Searching...';
  try {
    // Сначала найти user_id по логину через admin/users
    var users = await apiCall('/admin/users?session_token=' + ST + '&limit=200');
    var found = users.items.find(function(u) { return u.login.toLowerCase() === login.toLowerCase(); });
    if (!found) { document.getElementById('lookup-result').innerHTML = '<span style="color:#f85149">User not found</span>'; return; }
    var uid = found.user_id;
    var d = await apiCall('/account/api/profile/' + uid + '?session_token=' + ST);
    var pr = d.profile;
    var h = '<div style="text-align:center;margin-bottom:6px">' + avatarHtml(pr, 56) + '</div>';
    h += '<h3 style="text-align:center">' + esc(pr.display_name || pr.login) + '</h3>';
    h += '<div style="text-align:center;color:#7f8b98;margin-bottom:8px">@' + esc(pr.login) + ' · ' + pr.role + ' · ' + pr.status + '</div>';
    if (pr.phone) h += '<div><b>Phone:</b> ' + esc(pr.phone) + '</div>';
    if (pr.profile_bio) h += '<div style="margin-top:4px"><b>Bio:</b><br>' + esc(pr.profile_bio).replace(/\\n/g,'<br>') + '</div>';
    document.getElementById('lookup-result').innerHTML = '<div class="card" style="margin-top:8px">' + h + '</div>';
  } catch(e) { document.getElementById('lookup-result').innerHTML = '<span style="color:#f85149">' + e.message + '</span>'; }
}

// Restore the admin session (if any) once the script is fully parsed.
restoreSession();

</script></body></html>
