<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0e">
<meta name="robots" content="noindex">
<title>Админ-панель · Local Chat</title>
<style>
:root{
  --bg:#0b0b0e; --card:#1c1c1f; --card2:#232327; --hair:rgba(255,255,255,.07);
  --text:#f2f2f4; --sub:#8e8e93; --muted:#6a6a70;
  --accent:#5856e0; --link:#7b87ff; --green:#34c759; --orange:#ff9f2e; --red:#ef4e63;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0b0b0e}
body{margin:0;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:16px;line-height:1.35;overscroll-behavior-y:none}
#app{max-width:560px;margin:0 auto;height:100vh;height:100dvh;background:var(--bg);position:relative;display:flex;flex-direction:column;overflow:hidden}
.screen{flex:1;min-height:0;display:flex;flex-direction:column}
.hidden{display:none!important}
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.i.s16{width:16px;height:16px}.i.s18{width:18px;height:18px}.i.s22{width:22px;height:22px}.i.s24{width:24px;height:24px}

.topbar{display:flex;align-items:center;gap:10px;padding:12px 14px 6px}
.topbar .tb-title{flex:1;text-align:center;font-size:18px;font-weight:700}
.icon-btn{width:42px;height:42px;border-radius:999px;border:0;background:var(--card);color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;font-family:inherit;flex:none}

.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 14px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:var(--card);border:1px solid var(--hair);color:var(--sub);border-radius:999px;padding:9px 15px;font-size:14.5px;font-family:inherit;cursor:pointer;white-space:nowrap}
.chip.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}

.scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:2px 0 calc(24px + env(safe-area-inset-bottom,0px))}
.card{background:var(--card);border-radius:20px;margin:10px 14px;padding:6px 0 8px}
.card-head{display:flex;align-items:center;gap:9px;padding:12px 16px 6px;color:var(--sub);font-size:15px}
.card-head .grow{flex:1}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:11px 16px;background:none;border:0;color:var(--text);font-size:16px;font-family:inherit;text-align:left;position:relative;cursor:pointer}
.row:not(:last-child)::after{content:"";position:absolute;left:62px;right:16px;bottom:0;height:1px;background:var(--hair)}
.row.no-line::after{display:none}
.row .rcol{min-width:0;flex:1}
.row .rt{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .rsub{display:block;font-size:13px;color:var(--sub);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .chev{margin-left:auto;color:#5f5f66;font-size:20px;line-height:1}
.row.danger{color:var(--red)}
.row.danger .i{color:var(--red)}
.badge{font-size:12px;color:var(--sub);background:#2a2a2e;border-radius:999px;padding:2px 9px}
.avatar{width:40px;height:40px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;color:#fff;flex:none;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.pill{font-size:12.5px;border-radius:999px;padding:3px 10px;font-weight:600;white-space:nowrap}
.st-open{background:rgba(88,86,224,.2);color:#a5a3ff}
.st-in_progress{background:rgba(255,159,46,.18);color:#ffb95e}
.st-resolved{background:rgba(52,199,89,.16);color:#5fd97e}
.st-closed{background:#2a2a2e;color:#9a9aa0}
.st-active{background:rgba(52,199,89,.16);color:#5fd97e}
.st-banned,.st-blocked{background:rgba(239,78,99,.16);color:#ff8fa0}

.btn-accent{width:100%;height:50px;border:0;border-radius:16px;background:var(--accent);color:#fff;font-size:16px;font-weight:600;font-family:inherit;cursor:pointer}
.btn-accent:disabled{opacity:.5}
.btn-line{width:100%;height:48px;border:1px solid var(--hair);border-radius:16px;background:none;color:var(--text);font-size:16px;font-weight:600;font-family:inherit;cursor:pointer}
.btn-danger{width:100%;height:50px;border:0;border-radius:16px;background:#b3374a;color:#fff;font-size:16px;font-weight:600;font-family:inherit;cursor:pointer}
.btn-row{display:flex;gap:10px;margin-top:6px}
.btn-row .btn-accent,.btn-row .btn-line,.btn-row .btn-danger{flex:1;width:auto}
.inp{width:100%;background:var(--card);border:1px solid var(--hair);border-radius:14px;color:var(--text);font-size:16px;font-family:inherit;padding:13px 14px;outline:none}
.inp::placeholder{color:var(--muted)}
.inp.area{min-height:90px;resize:none}
.form{padding:2px 14px 14px;display:flex;flex-direction:column;gap:10px}
.l-error{color:var(--red);font-size:13.5px;min-height:16px;margin-top:2px}
.kv{display:flex;align-items:center;justify-content:space-between;padding:11px 16px;position:relative;font-size:16px;gap:12px}
.kv:not(:last-child)::after{content:"";position:absolute;left:16px;right:16px;bottom:0;height:1px;background:var(--hair)}
.kv .k{color:var(--sub)}
.kv .v{font-weight:600;text-align:right;min-width:0;overflow-wrap:anywhere}
.note{color:var(--sub);font-size:14px;line-height:1.45;padding:0 16px 8px}

.empty{padding:26px 20px;text-align:center;color:var(--sub);font-size:15px}
.spin{width:24px;height:24px;border:2.5px solid #333;border-top-color:#9a9aa0;border-radius:50%;animation:sp 1s linear infinite;margin:28px auto}
@keyframes sp{to{transform:rotate(360deg)}}

.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;padding:10px 16px 12px}
.stat{background:var(--card2);border-radius:16px;padding:12px}
.stat .n{font-size:18px;font-weight:700}
.stat .l{font-size:11.5px;color:var(--sub);margin-top:2px}

.msg{display:flex;gap:10px;margin:10px 16px}
.msg .m-ava{width:34px;height:34px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:18px;flex:none;background:#2a2a2e;overflow:hidden}
.msg .m-main{flex:1;min-width:0}
.msg .m-head{display:flex;align-items:baseline;gap:8px}
.msg .m-name{font-size:14.5px;font-weight:600}
.msg .m-time{font-size:12.5px;color:var(--sub);margin-left:auto;white-space:nowrap}
.msg .m-text{font-size:15px;line-height:1.4;margin-top:3px;overflow-wrap:break-word;white-space:pre-wrap}
.att-img img{max-width:210px;max-height:250px;border-radius:12px;display:block;margin-top:6px}
.att-file{display:inline-flex;gap:8px;align-items:center;color:var(--link);font-size:14px;text-decoration:none;background:#26262b;border-radius:12px;padding:7px 11px;max-width:100%;margin-top:6px}
.att-file span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ava-wrap{position:relative;flex:none}
.on-dot{position:absolute;right:-1px;bottom:-1px;width:12px;height:12px;border-radius:999px;background:var(--green);border:2.5px solid var(--card)}
.search-wrap{padding:10px 16px 4px}
.rep{margin:10px 16px 12px;padding:12px;background:var(--card2);border-radius:16px}
.rep-head{display:flex;align-items:baseline;gap:8px;font-size:15px;font-weight:600;flex-wrap:wrap;overflow-wrap:anywhere}
.rep-head .t{color:var(--sub);font-size:12.5px;font-weight:400;margin-left:auto;white-space:nowrap}
.rep-sub{color:var(--sub);font-size:13px;margin-top:4px;line-height:1.4}
.rep-sub b{color:var(--orange);font-weight:600}
.rep-comment{font-size:14px;color:#c9c9ce;background:#191a1e;border-radius:10px;padding:8px 10px;margin-top:8px;white-space:pre-wrap;overflow-wrap:anywhere}
.rep-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.rep-actions button{flex:1;min-width:92px;height:38px;border:0;border-radius:12px;font-size:13.5px;font-weight:600;font-family:inherit;cursor:pointer}
.btn-ban{background:#b3374a;color:#fff}
.btn-warn{background:#8a6a1f;color:#ffe3a3}
.btn-dismiss{background:#2a2a2e;color:var(--text)}
.btn-ghost{background:#26262b;color:var(--link)}
.rep-ctx{display:none;margin-top:10px;border-top:1px solid var(--hair);padding-top:6px}
.rep-ctx.show{display:block}
.ctx-item{border-top:1px solid var(--hair);padding:7px 0;font-size:13.5px;overflow-wrap:anywhere}
.ctx-item:first-child{border-top:0}
.ctx-time{color:var(--sub);font-size:12px;margin-bottom:2px}

.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:.2s;z-index:30}
.sheet-bg.show{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));background:#202024;border-radius:22px;padding:8px 0 10px;transform:translateY(115%);transition:.25s;z-index:31;max-height:78%;overflow-y:auto;overscroll-behavior:contain;visibility:hidden}
.sheet.show{transform:translateY(0);visibility:visible}
.sheet .s-title{font-size:13px;color:var(--sub);text-align:center;padding:10px 16px 6px}
.sheet .srow{display:flex;align-items:center;gap:14px;width:100%;padding:13px 20px;background:none;border:0;color:var(--text);font-size:16px;font-family:inherit;text-align:left;cursor:pointer}
.sheet .srow:active{background:#2a2a2e}
.sheet .srow.danger{color:var(--red)}
.sheet .srow.danger .i{color:var(--red)}
.sheet .s-form{padding:4px 18px 12px;display:flex;flex-direction:column;gap:10px}
.sheet .s-form .inp{background:#26262b}
.sheet .s-note{color:var(--sub);font-size:13.5px;padding:0 18px 8px;line-height:1.45}
.sheet .s-item{display:flex;align-items:center;gap:12px;width:100%;padding:10px 14px;background:none;border:0;color:var(--text);font-family:inherit;font-size:15px;text-align:left;cursor:pointer;border-radius:12px}
.sheet .s-item:active{background:#2a2a2e}
.sheet .s-empty{color:var(--sub);font-size:14px;text-align:center;padding:14px}
.toast{position:absolute;left:50%;bottom:100px;transform:translateX(-50%) translateY(8px);background:#2c2c31;color:#eaeaea;font-size:14px;padding:9px 16px;border-radius:999px;opacity:0;transition:.25s;pointer-events:none;z-index:40;max-width:84%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.login-wrap{flex:1;display:flex;flex-direction:column;justify-content:center;padding:28px 22px calc(28px + env(safe-area-inset-bottom,0px));overflow-y:auto}
.login-card{display:flex;flex-direction:column;gap:10px}
.lg-title{font-size:26px;font-weight:800;text-align:center}
.lg-sub{color:var(--sub);font-size:15px;text-align:center;margin-bottom:14px}

/* ---------- адаптация под экраны ---------- */
@media (min-width:620px) and (min-height:620px){
  html,body{background:#050507}
  #app{height:calc(100dvh - 24px);margin:12px auto;border-radius:26px;box-shadow:0 0 0 1px var(--hair),0 30px 70px rgba(0,0,0,.6)}
}
@media (max-width:379px){
  .topbar{padding:10px 10px 4px}
  .chips{padding:8px 10px 8px}
  .card{margin:8px 10px}
  .row{padding:10px 12px;gap:10px}
  .row:not(:last-child)::after{left:58px;right:12px}
  .sheet{left:8px;right:8px}
}
</style></head>

<div id="app">

  <!-- ================= ВХОД ================= -->
  <section class="screen" id="scr-login">
    <div class="login-wrap">
      <div class="login-card">
        <div class="lg-title">Админ-панель</div>
        <div class="lg-sub">Local Chat · Raspberry Pi</div>
        <input class="inp" id="l" placeholder="Логин" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false">

        <div class="l-error" id="l-err"></div>
        <button class="btn-accent" id="l-btn">Войти</button>
        <button class="btn-line" onclick="location.href='/'">← Вернуться в приложение</button>
        <button class="btn-line" id="lang-toggle" onclick="switchLang()">🇬🇧 ENG</button>
      </div>
    </div>
  </section>

  <!-- ================= ПАНЕЛЬ ================= -->
  <section class="screen hidden" id="scr-main">
    <header class="topbar">
      <button class="icon-btn" onclick="location.href='/'" title="В приложение"><svg class="i s22"><use href="#i-back"/></svg></button>
      <div class="tb-title" id="tb-title">Админ-панель</div>
      <button class="icon-btn" id="lang-btn" onclick="switchLang()" title="Language"><span id="lang-btn-t" style="font-size:11px;font-weight:700">EN</span></button>
      <button class="icon-btn" id="logout-btn" title="Выйти"><svg class="i s22"><use href="#i-out"/></svg></button>

    <div class="scroll" id="content"></div>

function tr(s){ if (LANG !== "eng") return s; var e = EN[s]; return e !== undefined ? e : s; }
function tr2(ru, en){ return LANG === "eng" ? en : ru; }
function tf(s, v){ var out = tr(s); return out.indexOf("{}") >= 0 ? out.replace("{}", v) : out + v; }
function switchLang(){
  LANG = (LANG === "eng") ? "rus" : "eng";
  try { localStorage.setItem("lc_lang", LANG); } catch(e) {}
  location.reload();
}
window.switchLang = switchLang;
function applyStatic(){
  document.documentElement.lang = LANG === "eng" ? "en" : "ru";
  document.title = tr("Админ-панель · Local Chat");
  var lt = $("lang-toggle");
  if (lt) lt.textContent = LANG === "eng" ? "🇷🇺 RUS" : "🇬🇧 ENG";
  var lb = $("lang-btn-t");
  if (lb) lb.textContent = LANG === "eng" ? "RU" : "EN";
  if (LANG !== "eng") return;
  var cyr = /[А-Яа-яЁё]/;
  var walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, null);
  var nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(function(tn){
    var parent = tn.parentNode;
    if (!parent || parent.nodeName === "SCRIPT" || parent.nodeName === "STYLE") return;
    var raw = tn.nodeValue;
    if (!raw || !cyr.test(raw)) return;
    var key = raw.trim().replace(/\s+/g, " ");
    var val = EN[key];
    if (val === undefined || !val) return;
    tn.nodeValue = raw.replace(raw.trim(), val);
  });
  document.querySelectorAll("[placeholder],[title]").forEach(function(el){
    ["placeholder", "title"].forEach(function(attr){
      var v = el.getAttribute(attr);
      if (!v || !cyr.test(v)) return;
      var t = EN[v.trim().replace(/\s+/g, " ")];
      if (t !== undefined && t) el.setAttribute(attr, t);
    });
  });
}

function fmtDate(ms){
  var d = new Date(ms || Date.now());

    var me = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    return me[d.getMonth()] + " " + d.getDate() + ", " + pad2(d.getHours()) + ":" + pad2(d.getMinutes());

function fmtUptime(hh){
  var s = hh && hh.uptime_seconds;

  var d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600), m = Math.floor((s % 3600) / 60);

  return (d ? d + "д " : "") + h + "ч " + m + "м";
}

/* ---------- api ---------- */
async function api(url, method, body){
  var opts = { method: method || "GET", headers: { "Content-Type": "application/json" } };
  if (body) opts.body = JSON.stringify(body);
  var r = await fetch(url, opts);
  var d = await r.json().catch(function(){ return {}; });
  if (!r.ok) {
    var m = "HTTP " + r.status;
    if (d && d.detail) {
      if (typeof d.detail === "string") m = d.detail;
      else if (Array.isArray(d.detail) && d.detail.length) m = d.detail[0].msg || m;
      else m = d.detail.message || d.detail.code || m;
    }
    var e = new Error(m); e.status = r.status; throw e;
  }
  return d;
}
async function uploadFile(file){
  var fd = new FormData(); fd.append("file", file);
  var r = await fetch("/media/api/attachments?session_token=" + tk(), { method: "POST", body: fd });
  var d = await r.json().catch(function(){ return {}; });
  if (!r.ok) throw new Error((d.detail && (d.detail.message || d.detail.code)) || (tr("Ошибка загрузки (") + r.status + ")"));
  return d;
}

async function doLogin(){
  var login = $("l").value.trim();
  var pass = $("p").value;
  var err = $("l-err");
  err.textContent = "";
  if (!login || !pass) { err.textContent = tr("Введите логин и пароль"); return; }
  var btn = $("l-btn");
  btn.disabled = true; btn.textContent = tr("Вход...");
  try {
    var d = await api("/auth/login", "POST", { login: login, password: pass, client_kind: "web" });
    if (d.user.role !== "admin" && d.user.role !== "moderator") { err.textContent = tr("Доступ только для админа"); return; }
    ST = d.session.token;
    localStorage.setItem(ADMIN_TOKEN_KEY, ST);
    localStorage.setItem(ADMIN_USER_KEY, JSON.stringify(d.user));
    try { sessionStorage.removeItem("lc_admin_sso_off"); } catch(e) {}
    await loadMe();
    showMain();
  } catch(e) { err.textContent = e.message; }
  finally { btn.disabled = false; btn.textContent = tr("Войти"); }
}
async function loadMe(){
  try {
    var d = await api("/account/api/profile?session_token=" + tk());
    ME = d.profile || ME;
  } catch(e) { /* остаётся из localStorage */ }
  if (!ME) { try { ME = JSON.parse(localStorage.getItem(ADMIN_USER_KEY) || "{}"); } catch(e) { ME = {}; } }
}
function doLogout(){
  ST = null; ME = null;
  localStorage.removeItem(ADMIN_TOKEN_KEY);
  localStorage.removeItem(ADMIN_USER_KEY);
  try { sessionStorage.setItem("lc_admin_sso_off", "1"); } catch(e) {}
  location.reload();
}
async function boot(){
  applyStatic();
  var tok = null;
  try { tok = localStorage.getItem(ADMIN_TOKEN_KEY); } catch(e) {}
  if (!tok) {
    var ssoOff = false;
    try { ssoOff = sessionStorage.getItem("lc_admin_sso_off") === "1"; } catch(e) {}
    var appTok = null;
    try { appTok = localStorage.getItem("lc_session_token"); } catch(e) {}
    if (appTok && !ssoOff) {
      try {
        var d0 = await api("/account/api/profile?session_token=" + encodeURIComponent(appTok));
        var role = d0.profile && d0.profile.role;
        if (role === "admin" || role === "moderator") { ST = appTok; ME = d0.profile; showMain(); return; }
      } catch(e) { /* не пустило — покажем форму */ }
    }
    showLogin("");
    return;
  }
  ST = tok;
  try {
    await loadMe();
    var role2 = ME && ME.role;
    if (role2 !== "admin" && role2 !== "moderator") throw new Error("not admin");
    showMain();
  } catch(e) {
    ST = null;
    localStorage.removeItem(ADMIN_TOKEN_KEY);
    localStorage.removeItem(ADMIN_USER_KEY);
    showLogin("");
  }
}

function userSheet(u){
  var items = [];
  items.push({ icon: "i-user", label: tr("Профиль"), action: function(){ profileSheet(u.user_id, u.login); } });
  if (u.role === "moderator") items.push({ icon: "i-users", label: tr("Снять модератора"), action: function(){ setRole(u, "user"); } });
  else if (u.role !== "admin") items.push({ icon: "i-users", label: tr("Сделать модератором"), action: function(){ setRole(u, "moderator"); } });
  if (u.status === "active") {
    items.push({ icon: "i-clock", label: tr("Заблокировать на время"), action: function(){ tempBlockForm(u); } });
    items.push({ icon: "i-x", label: tr("Забанить"), danger: true, action: function(){ banUser(u); } });
  } else {
    items.push({ icon: "i-check", label: tr("Разбанить"), action: function(){ unbanUser(u); } });
  }
  if (u.device_blacklisted) {
    items.push({ icon: "i-check", label: tr("Разблокировать устройство"), action: function(){ unblacklistDevice(u); } });
  } else {
    items.push({ icon: "i-x", label: tr("Заблокировать устройство"), danger: true, action: function(){ blacklistDevice(u); } });
  }
  items.push({ icon: "i-refresh", label: tr("Сбросить пароль"), action: function(){ pwForm(u, function(){ renderUsers(); }); } });

var REP_REASONS = { spam: tr("Спам"), abuse: tr("Оскорбления"), profanity: tr("Мат"), ads: tr("Реклама"), scam: tr("Мошенничество"), other: tr("Другое") };
function reportCard(r, isAuto){
  var target = r.target_login || NAMES[r.target_user_id] || ("#" + r.target_user_id);
  var reporter = isAuto ? tr("Авто-модерация") : (r.reporter_login || ("#" + r.reporter_user_id));
  var h = '<div class="rep">';
  h += '<div class="rep-head">' + (isAuto ? "🤖 " : "") + esc(reporter) + " → " + esc(target) + '<span class="t">' + fmtDate(r.created_at_ms) + "</span></div>";
  var sub = esc(REP_REASONS[r.reason] || r.reason || "");
  if (isAuto && r.matched_words) sub += tr(" · слова: ") + "<b>" + esc(r.matched_words) + "</b>";
  if (r.target_reports_count > 1) sub += tr(" · жалоб на него: ") + r.target_reports_count;
  if (r.target_warn_count) sub += tr(" · предупреждений: ") + r.target_warn_count + "/3";
  sub += " · " + (r.status === "pending" ? '<span style="color:#ff8fa0">' + tr("ждёт решения") + '</span>' : esc(r.status) + (r.action ? " (" + esc(r.action) + ")" : ""));
  h += '<div class="rep-sub">' + sub + "</div>";
  if (r.comment) h += '<div class="rep-comment">' + esc(r.comment) + "</div>";
  if (r.attachments && r.attachments.length) h += attsHtml(r.attachments);
  h += '<div class="rep-ctx" id="ctx-' + r.id + '"></div>';
  h += '<div class="rep-actions">';
  h += '<button class="btn-ghost" data-act="ctx" data-uid="' + (r.target_user_id || 0) + '" data-rid="' + r.id + '">' + tr("Контекст") + '</button>';
  if (r.status === "pending") {
    h += '<button class="btn-ban" data-act="ban" data-rid="' + r.id + '">' + tr("Забанить") + '</button>';
    h += '<button class="btn-warn" data-act="warn" data-rid="' + r.id + '">' + tr("Предупредить") + (r.target_warn_count ? " " + r.target_warn_count + "/3" : "") + "</button>";
    h += '<button class="btn-dismiss" data-act="dismiss" data-rid="' + r.id + '">' + tr("Отклонить") + '</button>';
  }
  h += "</div></div>";
  return h;
}
async function renderReports(){
  var d;
  try { d = await api("/reports/api/list?session_token=" + tk() + "&limit=100&_=" + Date.now()); }
  catch(e) { setContent(emptyBox(e.message)); return; }
  var all = d.reports || [];
  var user = all.filter(function(r){ return (r.source || "user") !== "auto"; });
  var auto = all.filter(function(r){ return r.source === "auto"; });
  var pendingOf = function(list){ return list.filter(function(r){ return r.status === "pending"; }).length; };
  var html = "";
  html += '<div class="card"><div class="card-head"><span>' + tr("Жалобы пользователей") + '</span><span class="grow"></span><span class="badge">' + pendingOf(user) + tr(" ожидают") + "</span></div>";
  if (!user.length) html += emptyBox(tr("Жалоб нет"));
  user.forEach(function(r){ html += reportCard(r, false); });
  html += "</div>";
  html += '<div class="card"><div class="card-head"><span>' + tr("Автомодерация") + '</span><span class="grow"></span><span class="badge">' + pendingOf(auto) + tr(" ожидают") + "</span></div>";
  if (!auto.length) html += emptyBox(tr("Срабатываний нет"));
  auto.forEach(function(r){ html += reportCard(r, true); });
  html += "</div>";
  setContent(html);
  $("content").querySelectorAll(".rep-actions button").forEach(function(b){
    b.onclick = function(){
      var act = b.getAttribute("data-act");
      var rid = Number(b.getAttribute("data-rid"));
      if (act === "ctx") { toggleReportContext(rid, Number(b.getAttribute("data-uid"))); return; }
      if (act === "ban") { askConfirm(tr("Бан"), tr("Забанить пользователя по этой жалобе?"), function(){ resolveReport(rid, "ban"); }); return; }
      resolveReport(rid, act);
    };
  });
}
async function toggleReportContext(rid, uid){
  var box = document.getElementById("ctx-" + rid);

async function resolveReport(rid, action){
  try {

  } catch(e) { toast(e.message); }

  var html = '<div class="card"><div class="card-head"><span>' + tr("Очистка данных") + '</span></div>';
  acts.forEach(function(a, i){
    html += '<button class="row' + (i >= 3 ? " danger" : "") + '" data-i="' + i + '"><svg class="i s22" style="margin:0 4px"><use href="#i-trash"/></svg><span class="rcol"><span class="rt">' + a[1] + "</span></span></button>";
  });
  html += "</div>";
  setContent(html);
  $("content").querySelectorAll("[data-i]").forEach(function(b){
    var a = acts[Number(b.getAttribute("data-i"))];
    b.onclick = function(){
      askConfirm(a[1], a[2], async function(){
        try {
          var body = a[0] === "full-reset" ? { session_token: ST, confirm: true } : { session_token: ST };
          var r = await api("/chat/api/admin/" + a[0], "POST", body);
          toast(tr("Готово") + (r && r.deleted_count != null ? tr(": удалено ") + r.deleted_count : ""));
        } catch(e) { toast(e.message); }
      });
    };
  });
}

/* ================= СИСТЕМА ================= */
var sysTimer = null;
async function refreshSystemStats(){
  var box = $("sys-stats");
  if (!box) return;
  try {
    var h = await api("/ops/api/system-health?session_token=" + tk() + "&_=" + Date.now());
    var hh = h.health || {};
    var cpu = String(hh.cpu_temp == null ? "?" : hh.cpu_temp);
    if (/can't open|error|permission|denied/i.test(cpu)) cpu = "—";
    box.innerHTML =
      '<div class="stat"><div class="n" style="color:#5fd97e">' + esc(cpu) + '</div><div class="l">' + tr("темп. CPU") + '</div></div>' +
      '<div class="stat"><div class="n">' + esc(hh.ram_used || "?") + '</div><div class="l">' + tr("RAM из ") + esc(hh.ram_total || "?") + "</div></div>" +
      '<div class="stat"><div class="n">' + esc(hh.disk_pct || "?") + '</div><div class="l">' + tr("диск ") + esc(hh.disk_used || "") + "</div></div>" +
      '<div class="stat"><div class="n">' + esc(hh.load1 || "?") + '</div><div class="l">' + tr("нагрузка") + '</div></div>' +
      '<div class="stat"><div class="n" style="font-size:13.5px">' + esc(fmtUptime(hh)) + '</div><div class="l">' + tr("аптайм") + '</div></div>' +
      '<div class="stat"><div class="n" style="font-size:13.5px">' + new Date().toTimeString().slice(0, 8) + '</div><div class="l">' + tr("обновлено") + '</div></div>';
  } catch(e) { box.innerHTML = '<div class="empty">' + esc(e.message) + "</div>"; }
  try {
    var c = await api("/ops/api/sync-time", "POST", { session_token: ST, client_time_ms: Date.now() });
    var c1 = $("clk-server"); if (c1) c1.textContent = fmtDate(c.server_time_ms);
    var c2 = $("clk-device"); if (c2) c2.textContent = fmtDate(Date.now());
    var c3 = $("clk-off"); if (c3) c3.textContent = (c.offset_ms > 0 ? "+" : "") + (c.offset_ms / 1000).toFixed(1) + tr(" с") + (c.adjusted ? tr(" · подтянуто") : "");
  } catch(e) {}
}
async function renderSystem(){
  var s = null, err = "";
  try { s = await api("/ops/api/services?session_token=" + tk() + "&_=" + Date.now()); } catch(e) { err = e.message; }
  var html = "";
  if (err) html += '<div class="card">' + emptyBox(err) + "</div>";
  html += '<div class="card"><div class="card-head"><span>' + tr("Время платы") + '</span><span class="grow"></span><span class="badge">' + tr("сверка с устройством") + '</span></div>' +
    '<div class="kv"><span class="k">' + tr("Часы платы") + '</span><span class="v" id="clk-server">—</span></div>' +
    '<div class="kv"><span class="k">' + tr("Это устройство") + '</span><span class="v" id="clk-device">—</span></div>' +
    '<div class="kv"><span class="k">' + tr("Расхождение") + '</span><span class="v" id="clk-off">—</span></div>' +
    '<div class="form"><button class="btn-line" id="clk-sync">' + tr("Синхронизировать с устройством") + '</button></div></div>';
  html += '<div class="card"><div class="card-head"><span>Raspberry Pi</span><span class="grow"></span><span class="badge">' + tr("live · 10с") + '</span></div>' +
    '<div class="stats" id="sys-stats"><div class="spin" style="grid-column:1/-1"></div></div>' +
    '<div class="form"><button class="btn-line" id="sys-refresh">' + tr("Обновить сейчас") + '</button></div></div>';
  if (s && s.services) {
    html += '<div class="card"><div class="card-head"><span>' + tr("Сервисы") + '</span></div>';
    s.services.forEach(function(svc, i){
      html += '<div class="row no-line"><span class="rcol"><span class="rt">' + esc(svc.name) + '</span><span class="rsub" style="color:' + (svc.active === "active" ? "#5fd97e" : "#ff8fa0") + '">' + esc(svc.active) + (svc.substate && svc.substate !== svc.active ? " · " + esc(svc.substate) : "") + '</span></span>' +
        '<button class="chip" data-svc="' + i + '" style="padding:7px 12px;font-size:13.5px">' + tr("Перезапуск") + '</button></div>';
    });
    html += '<div class="form"><button class="btn-danger" id="reboot-btn">' + tr("Перезагрузить плату") + '</button></div></div>';
  }
  html += '<div class="card"><div class="card-head"><span>' + tr("Отладка") + '</span></div><div class="form"><button class="btn-line" id="dbg-btn">' + tr("Журнал событий (100)") + '</button></div></div>';
  setContent(html);
  refreshSystemStats();
  if (sysTimer) clearInterval(sysTimer);
  sysTimer = setInterval(function(){
    if (!document.hidden && TAB === "system" && !SUB) refreshSystemStats();
  }, 10000);
  $("sys-refresh").onclick = refreshSystemStats;
  $("clk-sync").onclick = async function(){ await refreshSystemStats(); toast(tr("Время сверено с устройством")); };
  if (s && s.services) {
    $("content").querySelectorAll("[data-svc]").forEach(function(b){
      var svc = s.services[Number(b.getAttribute("data-svc"))];
      b.onclick = function(){
        askConfirm(tr("Перезапуск"), tr("Перезапустить сервис ") + svc.name + "?", async function(){
          try { await api("/ops/api/restart-service", "POST", { session_token: ST, service: svc.name }); toast(tr("Перезапуск запущен")); setTimeout(renderSystem, 1500); }
          catch(e) { toast(e.message); }
        });
      };
    });
    $("reboot-btn").onclick = function(){
      askConfirm(tr("Перезагрузка"), tr("Перезагрузить Raspberry Pi? Портал будет недоступен ~минуту."), async function(){
        try { await api("/ops/api/restart-service", "POST", { session_token: ST, service: "reboot" }); toast(tr("Плата перезагружается...")); }
        catch(e) { toast(e.message); }
      });
    };
  }
  $("dbg-btn").onclick = async function(){
    openSheetHtml(tr("Журнал событий"), '<div class="spin"></div>');
    try {
      var d = await api("/debug/api/events?session_token=" + tk() + "&limit=100");
      var items = d.items || [];
      $("sheet-body").innerHTML = items.length ? '<div class="s-form">' + items.map(function(e){
        return '<div style="font-size:12.5px"><span style="color:' + (e.ok === 1 ? "#5fd97e" : "#ff8fa0") + '">' + (e.ok === 1 ? "ok" : "FAIL") + "</span> " +
          fmtDate(e.created_at_ms) + " · " + esc(e.stage) + " · " + esc(e.action || "") + (e.error ? '<div style="color:#ff8fa0">' + esc(e.error) + "</div>" : "") + "</div>";
      }).join("") + "</div>" : '<div class="s-note">' + tr("Пусто") + '</div>';
    } catch(e) { $("sheet-body").innerHTML = '<div class="s-note">' + esc(e.message) + "</div>"; }
  };
}

/* ================= СЕТЬ ================= */
async function renderNetwork(){
  var st = null, ifs = null, users = null, err = "";
  try { st = await api("/admin/network/wifi/status?session_token=" + tk()); } catch(e) { err = e.message; }
  try { ifs = await api("/admin/network/interfaces?session_token=" + tk()); } catch(e) {}
  try { users = await api("/admin/network/users?session_token=" + tk()); } catch(e) {}
  var html = "";
  if (err) html += '<div class="card">' + emptyBox(err) + "</div>";
  html += '<div class="card"><div class="card-head"><span>' + tr("Интернет (uplink)") + '</span><span class="grow"></span>' +
    (st ? (st.connected ? '<span class="pill st-active">' + tr("подключён") + '</span>' : '<span class="pill st-closed">' + tr("нет связи") + '</span>') : "") + "</div>";
  if (st) {
    html += '<div class="kv"><span class="k">' + tr("Сеть") + '</span><span class="v">' + esc(st.ssid || "—") + "</span></div>" +
      '<div class="kv"><span class="k">' + tr("Интерфейс") + '</span><span class="v">' + esc(st.interface || "—") + "</span></div>" +
      '<div class="kv"><span class="k">' + tr("IP-адрес") + '</span><span class="v">' + esc(st.ip_address || "—") + "</span></div>";
  }
  html += '<div class="form" style="flex-direction:row;gap:8px"><button class="btn-line" id="net-scan" style="flex:1">' + tr("Сканировать сети") + '</button>' +
    '<button class="btn-line" id="net-disc" style="flex:1">' + tr("Отключить") + '</button></div>' +
    '<div id="net-list" class="form"></div></div>';
  if (ifs && ifs.items && ifs.items.length) {
    html += '<div class="card"><div class="card-head"><span>' + tr("Wi-Fi адаптеры") + '</span></div>';
    ifs.items.forEach(function(it, i){
      html += '<div class="row no-line" style="flex-wrap:wrap"><span class="rcol"><span class="rt">' + esc(it.ifname) + ' <span style="color:var(--sub);font-size:12px">' + esc(it.chipset || "") + '</span></span>' +
        '<span class="rsub">' + tr("роль: ") + esc(it.role || "none") + " · " + esc(it.tx_power_dbm || "?") + ' dBm</span></span>' +
        '<button class="chip" data-if="' + i + '" data-role="ap" style="padding:6px 10px;font-size:12.5px">AP</button>' +
        '<button class="chip" data-if="' + i + '" data-role="uplink" style="padding:6px 10px;font-size:12.5px">Uplink</button></div>';
    });
    html += '<div class="form"><button class="btn-line" id="net-restart">' + tr("Перезапустить hostapd + dnsmasq") + '</button></div></div>';
  }
  if (users && users.items && users.items.length) {
    html += '<div class="card"><div class="card-head"><span>' + tr("Интернет для пользователей") + '</span></div>';
    users.items.forEach(function(u, i){
      html += '<div class="row no-line"><span class="rcol"><span class="rt">' + esc(u.login) + '</span><span class="rsub">' + esc(u.role) + "</span></span>" +
        '<button class="chip" data-net-user="' + i + '" style="padding:7px 12px;font-size:13px;' + (u.internet_enabled ? "background:rgba(52,199,89,.2);color:#5fd97e;border-color:transparent" : "") + '">' + (u.internet_enabled ? tr("вкл") : tr("выкл")) + "</button></div>";
    });
    html += "</div>";
  }
  setContent(html);
  var scanBox = $("net-list");
  if ($("net-scan")) $("net-scan").onclick = async function(){
    scanBox.innerHTML = '<div class="spin" style="margin:10px auto"></div>';
    try {
      var r = await api("/admin/network/wifi/scan?session_token=" + tk());
      var nets = r.networks || [];
      scanBox.innerHTML = nets.length ? nets.map(function(n, i){
        return '<button class="row no-line" data-net="' + i + '" style="background:#26262b;border-radius:12px;margin-bottom:6px"><span class="rcol"><span class="rt">' + esc(n.ssid) + '</span><span class="rsub">' + esc(n.signal) + '% · ' + esc(n.security === "open" ? tr("открытая") : tr("пароль")) + "</span></span><span class=\"chev\">›</span></button>";
      }).join("") : emptyBox(tr("Сетей не найдено"));
      scanBox.querySelectorAll("[data-net]").forEach(function(b){
        b.onclick = function(){
          var n = nets[Number(b.getAttribute("data-net"))];
          openForm(tr("Подключение к ") + n.ssid,
            '<input class="inp" id="wf-ssid" value="' + esc(n.ssid) + '" readonly>' +
            '<input class="inp" id="wf-pass" type="password" placeholder="' + (n.security === "open" ? tr("открытая сеть — пароль не нужен") : tr("Пароль")) + '" autocapitalize="off" autocorrect="off">' +
            '<button class="btn-accent" id="wf-go">' + tr("Подключиться") + '</button>',
            function(){
              $("wf-go").onclick = async function(){
                var pass = $("wf-pass") ? $("wf-pass").value : "";
                closeSheet();
                try {
                  var r2 = await api("/admin/network/wifi/connect", "POST", { session_token: ST, ssid: n.ssid, password: pass });
                  toast(r2.connected ? (tr("Подключено: ") + (r2.ip_address || "")) : tr("Не удалось подключиться"));
                  renderNetwork();
                } catch(e) { toast(e.message); }
              };
            });
        };
      });
    } catch(e) { scanBox.innerHTML = emptyBox(e.message); }
  };
  if ($("net-disc")) $("net-disc").onclick = function(){
    askConfirm(tr("Отключение"), tr("Отключить интернет-подключение (uplink)?"), async function(){
      try { await api("/admin/network/wifi/disconnect", "POST", { session_token: ST }); toast(tr("Отключено")); renderNetwork(); }
      catch(e) { toast(e.message); }
    });
  };
  if (ifs && ifs.items) $("content").querySelectorAll("[data-if]").forEach(function(b){
    var it = ifs.items[Number(b.getAttribute("data-if"))];
    b.onclick = function(){
      var role = b.getAttribute("data-role");
      askConfirm(tr("Смена роли"), tr("Назначить ") + it.ifname + tr(" как ") + role.toUpperCase() + tr("? Сетевые сервисы перезапустятся."), async function(){
        try { await api("/admin/network/interfaces/assign", "POST", { session_token: ST, ifname: it.ifname, role: role }); toast(tr("Готово")); renderNetwork(); }
        catch(e) { toast(e.message); }
      });
    };
  });
  if ($("net-restart")) $("net-restart").onclick = function(){
    askConfirm(tr("Перезапуск сети"), tr("Перезапустить hostapd и dnsmasq? Точка доступа мигнёт."), async function(){
      try { var r = await api("/admin/network/services/restart?session_token=" + tk(), "POST"); toast(tr("Перезапущено: ") + (r.ap_interface || "")); }
      catch(e) { toast(e.message); }
    });
  };
  if (users && users.items) $("content").querySelectorAll("[data-net-user]").forEach(function(b){
    var u = users.items[Number(b.getAttribute("data-net-user"))];
    b.onclick = async function(){
      try { await api("/admin/network/users/internet", "POST", { session_token: ST, user_id: u.user_id, enabled: !u.internet_enabled }); toast(tr("Готово")); renderNetwork(); }
      catch(e) { toast(e.message); }
    };
  });
}

/* ================= АКТИВНОСТЬ ================= */
async function renderActivity(){
  var r = null, on = { count: 0 }, err = "";
  try { r = await api("/chat/api/admin/activity?session_token=" + tk() + "&limit=50"); } catch(e) { err = e.message; }
  try { on = await api("/realtime/online", "POST", { session_token: ST }); } catch(e) {}
  if (err) { setContent(emptyBox(err)); return; }
  var html = '<div class="card"><div class="card-head"><span>' + tr("Активность") + '</span></div><div class="stats">' +
    '<div class="stat"><div class="n" style="color:#5fd97e">' + (r.stats.messages_30d || 0) + '</div><div class="l">' + tr("сообщений (30д)") + '</div></div>' +
    '<div class="stat"><div class="n" style="color:#7b87ff">' + (r.stats.users_30d || 0) + '</div><div class="l">' + tr("новых (30д)") + '</div></div>' +
    '<div class="stat"><div class="n">' + (on.count || 0) + '</div><div class="l">' + tr("онлайн") + '</div></div>' +
    "</div></div>";
  html += '<div class="card"><div class="card-head"><span>' + tr("Последние события") + '</span><span class="grow"></span><span class="badge">' + (r.stats.total_events || 0) + "</span></div>";
  if (!r.items || !r.items.length) html += emptyBox(tr("Событий нет"));
  else r.items.forEach(function(e){
    html += '<div class="row no-line"><span class="rcol"><span class="rt">' + esc(e.event) + '</span><span class="rsub">' + esc(e.user_login || "") + "</span></span><span style=\"color:var(--sub);font-size:12.5px\">" + fmtDate(e.time) + "</span></div>";
  });
  html += "</div>";
  setContent(html);
}

/* ================= ПАРОЛИ ================= */
async function renderPasswords(){
  var d;
  try { d = await api("/admin/users?session_token=" + tk() + "&limit=200"); }
  catch(e) { setContent(emptyBox(e.message)); return; }
  var items = d.items || [];
  var html = '<div class="card"><div class="card-head"><span>' + tr("Сброс паролей") + '</span></div>' +
    '<div class="search-wrap"><input class="inp" id="p-search" placeholder="' + tr("Поиск по логину...") + '" autocomplete="off" autocapitalize="off" spellcheck="false"></div>' +
    '<div id="p-list"></div></div>';
  setContent(html);
  var renderList = function(q){
    q = String(q || "").trim().toLowerCase();
    var list = items.filter(function(u){ return !q || String(u.login || "").toLowerCase().indexOf(q) >= 0; });
    var box = $("p-list");
    if (!list.length) { box.innerHTML = emptyBox(tr("Никого не найдено")); return; }
    box.innerHTML = list.map(function(u, i){
      return '<button class="row" data-i="' + i + '">' + avatarHtml(u.login, null) +
        '<span class="rcol"><span class="rt">' + esc(u.login) + '</span><span class="rsub">' + esc(u.role) + "</span></span>" +
        '<span class="chev">›</span></button>';
    }).join("");
    box.querySelectorAll("[data-i]").forEach(function(b){
      b.onclick = function(){ pwForm(list[Number(b.getAttribute("data-i"))], function(){ renderPasswords(); }); };
    });
  };
  renderList("");
  $("p-search").addEventListener("input", function(){ renderList(this.value); });
}

async function renderProfile(){
  var p = ME || {};
  try {
    var d = await api("/account/api/profile?session_token=" + tk());
    p = d.profile || p;
    ME = p;
  } catch(e) {}
  var html = '<div class="card"><div class="card-head"><span>' + tr("Мой профиль") + '</span></div>' +
    '<div style="text-align:center;padding:14px 0 4px">' + avatarHtml(p.login, p.avatar_url) + "</div>" +
    '<div style="text-align:center;font-size:18px;font-weight:700">' + esc(p.display_name || p.login) + "</div>" +
    '<div style="text-align:center;color:var(--sub);font-size:13.5px;padding-bottom:10px">@' + esc(p.login) + " · " + esc(p.role) + "</div>" +
    '<div class="kv"><span class="k">ID</span><span class="v">' + (p.user_id || "—") + "</span></div>" +
    '<div class="kv"><span class="k">' + tr("Статус") + '</span><span class="v">' + esc(statusLabel(p.status || "active")) + "</span></div>" +
    "</div>" +
    '<div class="card"><div class="card-head"><span>' + tr("Найти пользователя") + '</span></div>' +
    '<div class="form"><input class="inp" id="lu-login" placeholder="' + tr("Логин") + '" autocapitalize="off" autocorrect="off">' +
    '<button class="btn-line" id="lu-go">' + tr("Показать профиль") + '</button></div>' +
    '<div id="lu-result" class="form"></div></div>';
  setContent(html);
  $("lu-go").onclick = async function(){
    var login = $("lu-login").value.trim();
    if (!login) { toast(tr("Введите логин")); return; }
    $("lu-result").innerHTML = '<div class="spin"></div>';
    try {
      var du = await api("/admin/users?session_token=" + tk() + "&limit=200");
      var found = (du.items || []).filter(function(x){ return String(x.login).toLowerCase() === login.toLowerCase(); })[0];
      if (!found) { $("lu-result").innerHTML = '<div class="s-note">' + tr("Пользователь не найден") + '</div>'; return; }
      var dp = await api("/account/api/profile/" + found.user_id + "?session_token=" + tk());
      var up = dp.profile || {};
      $("lu-result").innerHTML = '<div class="kv"><span class="k">' + tr("Имя") + '</span><span class="v">' + esc(up.display_name || up.login) + "</span></div>" +
        '<div class="kv"><span class="k">' + tr("Роль") + '</span><span class="v">' + esc(up.role) + "</span></div>" +
        '<div class="kv"><span class="k">' + tr("Статус") + '</span><span class="v">' + esc(statusLabel(up.status)) + "</span></div>" +
        (up.phone ? '<div class="kv"><span class="k">' + tr("Телефон") + '</span><span class="v">' + esc(up.phone) + "</span></div>" : "");
    } catch(e) { $("lu-result").innerHTML = '<div class="s-note">' + esc(e.message) + "</div>"; }
  };
}

boot();
