<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>LC Admin</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d1117;color:#e6edf3;font:13px/1.5 monospace;padding:12px}
h2{color:#58a6ff;margin:0 0 8px}h3{margin:12px 0 6px;color:#58a6ff}
input,select,textarea,button{padding:6px 10px;border-radius:4px;border:1px solid #30363d;background:#161b22;color:#e6edf3;font:13px monospace;margin:2px}
button{cursor:pointer;border:none}button:hover{opacity:.85}
.btn-danger{background:#da3633;color:#fff}.btn-outline{background:#30363d}.btn-green{background:#238636}.btn-warn{background:#d29922;color:#000}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin:16px 0 8px}
.tab{padding:8px 16px;background:#161b22;border:1px solid #30363d;border-radius:6px 6px 0 0;cursor:pointer;color:#8b949e}
.tab.active,.tab:hover{background:#238636;color:#fff;border-color:#238636}
.panel{display:none}.panel.active{display:block}
table{width:100%;border-collapse:collapse;margin:8px 0;font-size:12px}
td,th{padding:6px 8px;border-bottom:1px solid #30363d;text-align:left}
th{color:#8b949e;font-weight:normal}
.card{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:12px;margin-bottom:12px}
#msg{color:#58a6ff;margin:8px 0;font-size:12px;min-height:18px}
#login{margin-bottom:12px}
.stat{text-align:center;padding:8px 12px}.stat .n{font-size:22px;font-weight:700}.stat .l{font-size:11px;color:#8b949e}
.row{display:flex;gap:12px;flex-wrap:wrap}
</style></head><body>
<h2>LC Admin Panel</h2>
<div id="js-status" style="background:#d29922;color:#000;padding:4px 8px;font-size:11px;margin-bottom:8px">JS checking...</div>
<div id="login"><form onsubmit="doLogin();return false" style="display:inline"><input id="l" placeholder="admin login" size="12" autocomplete="username"><input id="p" type="password" placeholder="admin password" size="12" autocomplete="current-password"><button type="submit" class="btn-green">Login</button></form><span id="loginMsg" style="color:#58a6ff;margin-left:8px;font-size:12px"></span></div>
<div id="main" style="display:none"><div id="msg"></div>
<div class="tabs"><div class="tab active" onclick="switchTab('users')">Users</div><div class="tab" onclick="switchTab('cleanup')">Cleanup</div><div class="tab" onclick="switchTab('system')">System</div><div class="tab" onclick="switchTab('passwords')">Passwords</div><div class="tab" onclick="switchTab('support')">Support</div><div class="tab" onclick="switchTab('mode')">Mode</div><div class="tab" onclick="switchTab('activity')">Activity</div><div class="tab" onclick="switchTab('network')">Network</div><div class="tab" onclick="switchTab('reports')">Reports</div>
  <div class="tab" onclick="switchTab('profile')">Profile</div></div>
<div id="panel-users" class="panel active"></div><div id="panel-cleanup" class="panel"></div><div id="panel-system" class="panel"></div><div id="panel-passwords" class="panel"></div><div id="panel-support" class="panel"></div><div id="panel-mode" class="panel"></div><div id="panel-activity" class="panel"></div><div id="panel-network" class="panel"></div><div id="panel-reports" class="panel"></div>
<div id="panel-profile" class="panel"></div></div>
<script>
var ST = "";
var _el = document.getElementById("js-status");
if (_el) _el.innerHTML = '<span style="color:#238636">JS loaded</span>';
window.onerror = function(m,u,l) {
  var el = document.getElementById("js-status");
  if (el) el.innerHTML = '<span style="color:#f85149">JS ERROR line '+l+': '+m+'</span>';
};


function msg(t) { var m = document.getElementById("msg"); m.innerHTML = t || ""; setTimeout(function() { m.innerHTML = ""; }, 5000); }
function esc(s) { var d = document.createElement("div"); d.textContent = s || ""; return d.innerHTML; }
function attachmentUrl(a) {
  var base = a.download_url || ("/media/api/attachments/" + a.attachment_id + "/download");
  return base + (base.indexOf("?") >= 0 ? "&" : "?") + "session_token=" + encodeURIComponent(ST);
}
function attachmentsHtml(items) {
  if (!items || !items.length) return "";
  var h = '<div style="display:flex;flex-wrap:wrap;gap:6px;margin:6px 0">';
  items.forEach(function(a) {
    var url = attachmentUrl(a);
    var name = esc(a.filename || ("attachment-" + a.attachment_id));
    if (a.media_kind === "image") {
      h += '<img src="' + url + '" alt="' + name + '" title="' + name + '" style="max-width:140px;max-height:120px;border-radius:6px;border:1px solid #30363d;cursor:zoom-in" onclick="openImg(this.src)">';
    } else {
      h += '<a href="' + url + '" target="_blank" rel="noopener" style="color:#58a6ff;font-size:12px;border:1px solid #30363d;border-radius:6px;padding:4px 8px;text-decoration:none">\ud83d\udcce ' + name + "</a>";
    }
  });
  return h + "</div>";
}
function openImg(src) {
  var o = document.getElementById("img-overlay");
  if (!o) {
    o = document.createElement("div");
    o.id = "img-overlay";
    o.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:99999;display:flex;align-items:center;justify-content:center;cursor:zoom-out";
    o.onclick = function() { o.remove(); };
    o.innerHTML = '<img style="max-width:92vw;max-height:88vh;border-radius:8px">';
    document.body.appendChild(o);
  }
  o.querySelector("img").src = src;
}
async function uploadFile(file) {
  var fd = new FormData();
  fd.append("file", file);
  var r = await fetch("/media/api/attachments?session_token=" + encodeURIComponent(ST), { method: "POST", body: fd });
  var d = await r.json().catch(function() { return {}; });
  if (!r.ok) throw new Error((d.detail && (d.detail.message || d.detail.code)) || ("Upload failed (" + r.status + ")"));
  return d.attachment;
}
function dbgReport(payload) {
  try { if (ST) payload.session_token = ST; fetch("/debug/api/client-event", {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)}).catch(function(){}); } catch(e) {}
}
function newTraceId(prefix) { return (prefix||"ad") + "-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2,7); }

async function doLogin() {
  var m = document.getElementById("loginMsg"); m.textContent = "...";
  var login = document.getElementById("l").value.trim();
  var pass = document.getElementById("p").value.trim();
  if (!login || !pass) { m.textContent = "Enter login and password"; return; }
  var tr = newTraceId("ad-login");
  var t1 = Date.now();
  try {
    var r = await fetch("/auth/login", {method:"POST",headers:{"Content-Type":"application/json","X-Debug-Trace":tr},body:JSON.stringify({login:login,password:pass,client_kind:"web"})});
    var t2 = Date.now();
    var d = await r.json();
    if (!r.ok) {
      dbgReport({trace_id:tr, action:"/auth/login", method:"POST", ok:false, status:r.status, stages_done:2, error:(d.detail ? d.detail.message : ("HTTP "+r.status)), t1_ms:t1, t2_ms:t2, t3_ms:Date.now()});
      throw new Error(d.detail ? d.detail.message : "HTTP " + r.status);
    }
    dbgReport({trace_id:tr, action:"/auth/login", method:"POST", ok:true, status:r.status, stages_done:3, t1_ms:t1, t2_ms:t2, t3_ms:Date.now()});
    if (d.user.role !== "admin" && d.user.role !== "moderator") { m.textContent = "Admin access only"; return; }
    ST = d.session.token;
    localStorage.setItem("lc_session_token", ST);
    localStorage.setItem("lc_user", JSON.stringify(d.user));
    m.textContent = "OK"; m.style.color = "#238636";
    showMain();
  } catch(e) {
    if (e.name === "TypeError") dbgReport({trace_id:tr, action:"/auth/login", method:"POST", ok:false, stages_done:1, error:"Server unreachable", t1_ms:t1, t3_ms:Date.now()});
    m.textContent = e.message;
  }
}

function showMain() {
  var me = {};
  try { me = JSON.parse(localStorage.getItem("lc_user") || "{}"); } catch(e) {}
  document.getElementById("login").innerHTML = '<span style="color:#238636">Logged in as <b>' + (me.login || "") + '</b></span> <button class="btn-outline" onclick="ST=\'\';localStorage.clear();location.reload()">Logout</button>';
  document.getElementById("main").style.display = "block";
  if (me.role !== "admin") {
    var keep = ["Users", "Reports", "Profile"];
    document.querySelectorAll(".tab").forEach(function(t) {
      if (keep.indexOf(t.textContent.trim()) === -1) t.style.display = "none";
    });
  }
  loadUsers();
}

function switchTab(t) {
  document.querySelectorAll(".tab").forEach(function(x) { x.classList.remove("active"); });
  document.querySelector(".tab[onclick*='" + t + "']").classList.add("active");
  document.querySelectorAll(".panel").forEach(function(x) { x.classList.remove("active"); });
  document.getElementById("panel-" + t).classList.add("active");
  if (t === "users") loadUsers();
  if (t === "support") loadSupport();
  if (t === "system") loadSystem();
  if (t === "passwords") loadPasswords();
  if (t === "mode") loadMode();
  if (t === "activity") loadActivity();
  if (t === "network") loadNetwork();
  if (t === "reports") loadReports();
  if (t === "profile") loadProfile();
}

async function apiCall(url, method, body) {
  var opts = { method: method || "GET", headers: { "Content-Type": "application/json" } };
  if (body) opts.body = JSON.stringify(body);
  var tr = newTraceId("ad");
  opts.headers["X-Debug-Trace"] = tr;
  var t1 = Date.now();
  try {
    var r = await fetch(url, opts);
    var t2 = Date.now();
    var d = await r.json().catch(function(){return{}});
    if (!r.ok) {
      var emsg = d.detail ? d.detail.message : ("HTTP " + r.status);
      dbgReport({trace_id:tr, action:url, method:opts.method, ok:false, status:r.status, stages_done:2, error:emsg, t1_ms:t1, t2_ms:t2, t3_ms:Date.now()});
      throw new Error(emsg);
    }
    dbgReport({trace_id:tr, action:url, method:opts.method, ok:true, status:r.status, stages_done:3, t1_ms:t1, t2_ms:t2, t3_ms:Date.now()});
    return d;
  } catch(e) {
    if (e.name === "TypeError") {
      dbgReport({trace_id:tr, action:url, method:opts.method, ok:false, stages_done:1, error:"Server unreachable", t1_ms:t1, t3_ms:Date.now()});
      throw new Error("Server unreachable");
    }
    throw e;
  }
}

// USERS
async function loadUsers() {
  var p = document.getElementById("panel-users");
  p.innerHTML = '<div class="card">Loading...</div>';
  var meRole = "user";
  try { meRole = JSON.parse(localStorage.getItem("lc_user") || "{}").role || "user"; } catch(e) {}
  var isFullAdmin = meRole === "admin";
  try {
    var d = await apiCall("/admin/users?session_token=" + ST + "&_=" + Date.now());
    var h = '<div class="card"><h3>Users (' + d.count + ')</h3><table><tr><th>ID</th><th>Login</th><th>Role</th><th>Status</th><th>Actions</th></tr>';
    d.items.forEach(function(u) {
      h += "<tr><td>" + u.user_id + "</td><td>" + esc(u.login) + "</td><td>" + u.role + "</td><td>" + u.status + "</td><td>";
      if (u.status === "active") {
        h += '<button class="btn-outline" onclick="userAction(' + u.user_id + ',\'setrole\',\'' + (u.role === "moderator" ? "user" : "moderator") + '\')">' + (u.role === "moderator" ? "Demote" : "Promote") + '</button> ';
        h += '<button class="btn-danger" onclick="userAction(' + u.user_id + ',\'ban\')">Ban</button> ';
        h += '<input id="tbdur' + u.user_id + '" type="number" value="60" min="1" max="10080" size="4" style="width:55px"> ';
        h += '<button class="btn-outline" onclick="tblk(' + u.user_id + ')">min</button> ';
        if (isFullAdmin) h += '<button class="btn-danger" onclick="delUser(' + u.user_id + ',this)">Delete</button>';
      } else {
        h += '<button class="btn-green" onclick="userAction(' + u.user_id + ',\'unban\')">Unban</button>';
      }
      h += "</td></tr>";
    });
    h += "</table></div>";
    p.innerHTML = h;
  } catch(e) { p.innerHTML = '<div class="card" style="color:#f85149">' + e.message + "</div>"; }
}

async function userAction(uid, action, role) {
  var label = action === "setrole" ? ("Set role to " + role) : (action === "ban" ? "Ban" : "Unban");
  if (!confirm(label + " user ID " + uid + "?")) return;
  msg("Working...");
  try {
    var body = { session_token: ST };
    if (role) body.role = role;
    await apiCall("/admin/users/" + uid + "/" + (action === "setrole" ? "set-role" : action), "POST", body);
    msg('<span style="color:#238636">' + action + " OK</span>");
    loadUsers();
  } catch(e) { msg('<span style="color:#f85149">' + e.message + "</span>"); }
}

async function tblk(uid) {
  var dur = parseInt(document.getElementById("tbdur" + uid).value || 60);
  if (isNaN(dur) || dur < 1 || dur > 10080) { msg("1-10080 min"); return; }
  if (!confirm("Temporarily block user ID " + uid + " for " + dur + " min?")) return;
  msg("Blocking...");
  try {
    await apiCall("/admin/users/" + uid + "/temporary-block", "POST", { session_token: ST, duration_minutes: dur });
    msg('<span style="color:#238636">Blocked ' + dur + "min</span>");
    loadUsers();
  } catch(e) { msg('<span style="color:#f85149">' + e.message + "</span>"); }
}

async function delUser(uid, btn) {
  var login = "";
  try { login = btn && btn.closest("tr") ? btn.closest("tr").children[1].textContent : ""; } catch(e) {}
  if (!confirm('Delete user "' + login + '" (ID ' + uid + ')? This cannot be undone.')) return;
  msg("Deleting...");
  try {
    await apiCall("/admin/users/" + uid + "?session_token=" + encodeURIComponent(ST), "DELETE");
    msg('<span style="color:#238636">Deleted ' + esc(login) + "</span>");
    loadUsers();
  } catch(e) { msg('<span style="color:#f85149">' + e.message + "</span>"); }
}

// CLEANUP
(function() {
  var html = '<div class="card"><h3>Cleanup</h3><div class="row">';
  var actions = [
    ["Clear Global Chat", "clear-global", "btn-outline"],
    ["Clear Blog", "clear-blog", "btn-outline"],
    ["Clear Support", "clear-support", "btn-outline"],
    ["Delete All Chats", "delete-chats", "btn-danger"],
    ["Delete All Users", "delete-users", "btn-danger"],
    ["FULL RESET", "full-reset", "btn-warn"]
  ];
  actions.forEach(function(a) {
    html += '<button class="' + a[2] + '" onclick="cleanupAction(\'' + a[1] + '\')">' + a[0] + "</button> ";
  });
  html += "</div></div>";
  document.getElementById("panel-cleanup").innerHTML = html;
})();

async function cleanupAction(action) {
  var map = {
    "clear-global": ["/chat/api/admin/clear-global", "POST"],
    "clear-blog": ["/chat/api/admin/clear-blog", "POST"],
    "clear-support": ["/chat/api/admin/clear-support", "POST"],
    "delete-chats": ["/chat/api/admin/delete-all-chats", "POST"],
    "delete-users": ["/chat/api/admin/delete-all-users", "POST"],
    "full-reset": ["/chat/api/admin/full-reset", "POST"]
  };
  var a = map[action];
  if (!a) return;
  msg("Working...");
  try {
    var body = action === "full-reset" ? { session_token: ST, confirm: true } : { session_token: ST };
    var r = await apiCall(a[0], a[1], body);
    msg('<span style="color:#238636">OK: ' + (r.deleted_count != null ? r.deleted_count + " items" : "done") + "</span>");
  } catch(e) { msg('<span style="color:#f85149">' + e.message + "</span>"); }
}

// SYSTEM
async function loadSystem() {
  var p = document.getElementById("panel-system");
  p.innerHTML = '<div class="card">Loading...</div>';
  try {
    var h = await apiCall("/ops/api/system-health?session_token=" + ST);
    var s = await apiCall("/ops/api/services?session_token=" + ST);
    var html = '<div class="card"><h3>RPi System</h3><div class="row">';
    html += '<div class="stat"><div class="n" style="color:#238636">' + (h.health.cpu_temp || "?") + '</div><div class="l">CPU</div></div>';
    html += '<div class="stat"><div class="n">' + h.health.ram_used + '</div><div class="l">RAM / ' + h.health.ram_total + "</div></div>";
    html += '<div class="stat"><div class="n">' + h.health.disk_used + '</div><div class="l">Disk ' + h.health.disk_pct + "</div></div>";
    html += '</div><h3>Services</h3><table><tr><th>Service</th><th>State</th><th>Action</th></tr>';
    s.services.forEach(function(svc) {
      var c = svc.active === "active" ? "#238636" : "#f85149";
      html += '<tr><td>' + svc.name + '</td><td style="color:' + c + '">' + svc.active + '</td><td><button class="btn-outline" onclick="sysRestart(\'' + svc.name + '\')">Restart</button></td></tr>';
    });
    html += '</table><button class="btn-warn" onclick="sysRestart(\'reboot\')">Reboot RPi</button> <span id="sysMsg" style="font-size:12px"></span></div>';
    html += '<div class="card"><h3>Debug Log</h3><button class="btn-outline" onclick="loadDebugLog()">Load last 100</button><div id="debug-log" style="margin-top:8px;max-height:320px;overflow-y:auto"></div></div>';
    p.innerHTML = html;
  } catch(e) { p.innerHTML = '<div class="card" style="color:#f85149">' + e.message + "</div>"; }
}

async function loadDebugLog() {
  var box = document.getElementById("debug-log");
  if (!box) return;
  box.textContent = "Loading...";
  try {
    var d = await apiCall("/debug/api/events?session_token=" + encodeURIComponent(ST) + "&limit=100");
    var h = '<table><tr><th>Time</th><th>Stage</th><th>Action</th><th>Status</th><th>OK</th><th>Stages</th><th>Error</th><th>Trace</th></tr>';
    (d.items || []).forEach(function(e) {
      var color = e.ok === 1 ? "#238636" : "#f85149";
      h += "<tr><td style=font-size:11px>" + new Date(e.created_at_ms).toLocaleTimeString() + "</td>";
      h += "<td>" + esc(e.stage) + "</td><td style=font-size:11px>" + esc(e.action || "") + " " + esc(e.method || "") + "</td>";
      h += "<td>" + (e.status == null ? "-" : e.status) + "</td><td style=color:" + color + ">" + (e.ok === 1 ? "ok" : "FAIL") + "</td>";
      h += "<td>" + (e.stages_done == null ? "-" : e.stages_done) + "/3</td><td style=font-size:11px;color:#f85149>" + esc(e.error || "") + "</td><td style=font-size:10px;color:#8b949e>" + esc(e.trace_id || "") + "</td></tr>";
    });
    h += "</table>";
    box.innerHTML = h;
  } catch(e) { box.textContent = "Error: " + e.message; }
}

async function sysRestart(svc) {
  var m = document.getElementById("sysMsg"); if (m) m.textContent = "Restarting " + svc + "...";
  if (svc === "reboot") { if (m) m.textContent = "Rebooting..."; }
  try {
    await apiCall("/ops/api/restart-service", "POST", { session_token: ST, service: svc });
    if (m) { m.innerHTML = '<span style="color:#238636">OK</span>'; setTimeout(function() { m.textContent = ""; }, 3000); }
  } catch(e) { if (m) m.innerHTML = '<span style="color:#f85149">' + e.message + "</span>"; }
}

// PASSWORDS
async function loadPasswords() {
  var p = document.getElementById("panel-passwords");
  p.innerHTML = '<div class="card">Loading...</div>';
  try {
    var d = await apiCall("/admin/users?session_token=" + ST + "&limit=200");
    var h = '<div class="card"><h3>Password Reset</h3><table><tr><th>Login</th><th>Role</th><th>New Password</th><th></th></tr>';
    d.items.forEach(function(u) {
      h += '<tr><td>' + esc(u.login) + '</td><td>' + u.role + '</td><td><input id="pw' + u.user_id + '" placeholder="min 8 chars" size="16"></td>';
      h += '<td><button class="btn-outline" onclick="pwReset(' + u.user_id + ')">Reset</button> <span id="pm' + u.user_id + '" style="font-size:11px"></span></td></tr>';
    });
    h += "</table></div>";
    p.innerHTML = h;
  } catch(e) { p.innerHTML = '<div class="card" style="color:#f85149">' + e.message + "</div>"; }
}

async function pwReset(uid) {
  var inp = document.getElementById("pw" + uid);
  var m = document.getElementById("pm" + uid);
  var pw = inp.value.trim();
  if (pw.length < 8) { m.textContent = "Min 8 chars"; return; }
  try {
    await apiCall("/admin/users/" + uid + "/reset-password", "POST", { session_token: ST, new_password: pw });
    m.textContent = "OK"; m.style.color = "#238636";
  } catch(e) { m.textContent = e.message; m.style.color = "#f85149"; }
}

// SUPPORT
async function loadSupport() {
  var p = document.getElementById("panel-support");
  p.innerHTML = '<div class="card">Loading...</div>';
  try {
    var d = await apiCall("/admin/content/support/tickets?session_token=" + ST);
    var h = '<div class="card"><h3>Support Tickets (' + d.count + ')</h3>';
    if (!d.items || !d.items.length) { h += '<p style="color:#8b949e">No tickets</p>'; }
    d.items.forEach(function(t) {
      h += '<div class="card"><strong>#' + t.ticket_id + " " + esc(t.title) + '</strong> <span style="color:#8b949e">' + t.status + "</span><br>";
      h += '<span style="font-size:11px;color:#8b949e">User #' + t.user_id + "</span>";
      h += '<div style="margin-top:6px"><select id="sts' + t.ticket_id + '"><option value="open" ' + (t.status === "open" ? "selected" : "") + '>open</option><option value="in_progress" ' + (t.status === "in_progress" ? "selected" : "") + '>in progress</option><option value="resolved" ' + (t.status === "resolved" ? "selected" : "") + '>resolved</option><option value="closed" ' + (t.status === "closed" ? "selected" : "") + '>closed</option></select> ';
      h += '<button class="btn-outline" onclick="suppStatus(' + t.ticket_id + ')">Update</button>';
      h += '<textarea id="sti' + t.ticket_id + '" placeholder="Reply..." rows="2" style="width:100%;margin-top:4px"></textarea>';
      h += '<input type="file" id="stf' + t.ticket_id + '" multiple style="display:none" accept="image/*,audio/*,video/mp4,video/webm,.pdf,.txt,.zip,.doc,.docx,.xls,.xlsx,.csv,.json">';
      h += '<button class="btn-outline" onclick="document.getElementById(\'stf' + t.ticket_id + '\').click()">\ud83d\udcce Attach</button> ';
      h += '<button class="btn-green" onclick="suppReply(' + t.ticket_id + ')">Send Reply</button></div></div>';
    });
    h += "</div>";
    p.innerHTML = h;
  } catch(e) { p.innerHTML = '<div class="card" style="color:#f85149">' + e.message + "</div>"; }
}

async function suppStatus(tid) {
  var sel = document.getElementById("sts" + tid); if (!sel) return;
  try { await apiCall("/admin/content/support/tickets/" + tid + "/status", "POST", { session_token: ST, status: sel.value }); msg('<span style="color:#238636">Status: ' + sel.value + "</span>"); }
  catch(e) { msg('<span style="color:#f85149">' + e.message + "</span>"); }

async function suppReply(tid) {
  var inp = document.getElementById("sti" + tid);
  var fileInput = document.getElementById("stf" + tid);
  var files = fileInput ? Array.prototype.slice.call(fileInput.files || []) : [];
  var text = inp ? inp.value.trim() : "";
  if (!text && !files.length) { msg("Reply cannot be empty"); return; }
  try {
    var ids = [];
    for (var i = 0; i < files.length; i++) { var a = await uploadFile(files[i]); ids.push(a.attachment_id); }
    await apiCall("/admin/content/support/tickets/" + tid + "/reply", "POST", { session_token: ST, body_text: text, attachment_ids: ids });
    if (inp) inp.value = "";
    if (fileInput) fileInput.value = "";
    msg('<span style="color:#238636">Reply sent</span>');
  } catch(e) { msg('<span style="color:#f85149">' + e.message + "</span>"); }
}

    h += '<div class="card"><h3>Internet Access</h3><table><tr><th>User</th><th>Internet</th><th>Toggle</th></tr>';

      h += '<td><button class="' + (u.internet_enabled ? "btn-danger" : "btn-green") + '" onclick="toggleInternet(' + u.user_id + ',' + (!u.internet_enabled) + ')">' + (u.internet_enabled ? "Disable" : "Enable") + '</button></td></tr>';

// WiFi functions
async function wifiScan() {
  var msg = document.getElementById("wifi-scan-msg");
  var results = document.getElementById("wifi-scan-results");
  msg.textContent = "Scanning..."; results.innerHTML = "";
  try {
    var d = await apiCall("/admin/network/wifi/scan?session_token=" + encodeURIComponent(ST));
    if (d.networks && d.networks.length) {
      var h = '<table><tr><th>SSID</th><th>Signal</th><th>Security</th></tr>';
      d.networks.forEach(function(n) {
        h += '<tr><td>' + esc(n.ssid) + '</td><td>' + (n.signal || "-") + '</td><td>' + (n.secure ? "🔒" : "🔓") + '</td></tr>';
      });
      h += '</table>';
      results.innerHTML = h;
    } else {
      results.innerHTML = '<span style="color:#8b949e">No networks found</span>';
    }
    msg.textContent = "Done (" + (d.interface || "uplink") + ")";
  } catch(e) { msg.textContent = "Error: " + e.message; msg.style.color = "#f85149"; }
}

async function wifiConnect() {
  var ssid = document.getElementById("wifi-ssid").value.trim();
  var pass = document.getElementById("wifi-pass").value.trim();
  if (!ssid) { msg("Enter SSID"); return; }
  msg("Connecting to " + ssid + "...");
  try {
    await apiCall("/admin/network/wifi/connect", "POST", { session_token: ST, ssid: ssid, password: pass || "" });
    msg("Waiting for IP...");
    // Check real status after 3+6+9 seconds
    for (var i = 0; i < 3; i++) {
      await new Promise(function(r) { setTimeout(r, 3000); });
      var st = await apiCall("/admin/network/wifi/status?session_token=" + ST);
      if (st.ip_address) {
        msg('<span style="color:#238636">Connected! IP: ' + st.ip_address + '</span>');
        return;
      }
    }
    msg('<span style="color:#d29922">Not connected — no IP after 9s. Check password.</span>');
  } catch(e) { msg('<span style="color:#f85149">' + e.message + '</span>'); }
}

async function saveNetworkConfig() {
  var m = document.getElementById("net-save-msg");
  m.textContent = "Saving...";
  // Collect mode changes
  var config = {};
  document.querySelectorAll("[id^='mode-']").forEach(function(sel) {
    if (sel.dataset && sel.dataset.initial === sel.value) return;
    var iface = sel.id.replace("mode-", "");
    config[iface] = sel.value;
  });
  if (!Object.keys(config).length) { m.textContent = "No changes to save"; return; }
  try {
    await apiCall("/admin/network/config/save", "POST", { session_token: ST, config: config });
    m.innerHTML = '<span style="color:#238636">Saved! Restarting network...</span>';
    setTimeout(function() { loadNetwork(); }, 3000);
  } catch(e) { m.textContent = "Error: " + e.message; m.style.color = "#f85149"; }
}

async function toggleInternet(uid, enable) {
  try { await apiCall("/admin/network/users/internet", "POST", { session_token: ST, user_id: uid, enabled: enable }); msg('<span style="color:#238636">Internet ' + (enable ? "enabled" : "disabled") + "</span>"); loadNetwork(); }
  catch(e) { msg('<span style="color:#f85149">' + e.message + "</span>"); }
}

// REPORTS: user reports (dedicated API) + auto-moderation
var REPORT_REASONS = {spam:"Spam",abuse:"Abuse",profanity:"Profanity",ads:"Ads",scam:"Scam",other:"Other"};
async function loadReports() {
  var p = document.getElementById("panel-reports");
  p.innerHTML = '<div class="card">Loading...</div>';
  var auto = {reports:[],pending_count:0}, user = {reports:[],pending_count:0};
  var autoErr = "", userErr = "";
  try { auto = await apiCall("/moderation/api/admin/reports?session_token=" + encodeURIComponent(ST) + "&limit=100"); } catch(e) { autoErr = e.message; }
  try { user = await apiCall("/reports/api/list?session_token=" + encodeURIComponent(ST) + "&limit=100"); } catch(e) { userErr = e.message; }

  var h = '<div class="card"><h3>User Reports <span style="color:#f85149">(' + (user.pending_count||0) + ' pending)</span></h3>';
  if (userErr) { h += '<p style="color:#f85149">' + esc(userErr) + '</p>'; }
  else if (!user.reports || !user.reports.length) { h += '<p style="color:#8b949e">No reports</p>'; }
  else {
    user.reports.forEach(function(r) {
      var sc = r.status === "pending" ? "#f85149" : "#8b949e";
      h += '<div class="card" style="border-left:3px solid ' + sc + '">';
      h += '<div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px"><strong>' + esc(r.reporter_login) + ' \u2192 ' + esc(r.target_login || ("User #" + r.target_user_id)) + '</strong><span style="font-size:11px;color:#8b949e">#' + r.id + " " + r.status + "</span></div>";
      h += '<div style="font-size:12px;color:#d29922;margin:4px 0">' + esc(REPORT_REASONS[r.reason] || r.reason) + " \u00b7 " + new Date(r.created_at_ms).toLocaleString();
      if (r.target_reports_count > 1) h += ' \u00b7 reports against: ' + r.target_reports_count;
      h += "</div>";
      if (r.comment) h += '<div style="font-size:12px;background:#0d1117;padding:6px;border-radius:4px;margin:4px 0;white-space:pre-wrap">' + esc(r.comment) + "</div>";
      if (r.attachments && r.attachments.length) h += attachmentsHtml(r.attachments);
      if (r.status === "pending") {
        h += '<div style="margin-top:6px"><button class="btn-danger" onclick="resolveUserReport(' + r.id + ',\'ban\')">Ban</button> <button class="btn-warn" onclick="resolveUserReport(' + r.id + ',\'warn\')">Warn (' + (r.target_warn_count || 0) + '/3)</button> <button class="btn-outline" onclick="resolveUserReport(' + r.id + ',\'dismiss\')">Dismiss</button> <button class="btn-outline" onclick="toggleTargetMessages(' + r.id + ',' + r.target_user_id + ')">Messages</button></div>';
      } else {
        h += '<div style="font-size:11px;color:#8b949e">Resolved: ' + esc(r.action || "?") + " by " + esc(r.resolved_by || "?") + "</div>";
      }
      h += '<div id="uevidence-' + r.id + '" style="display:none;margin-top:8px;background:#0d1117;border:1px solid #30363d;border-radius:6px;padding:8px"></div>';
      h += "</div>";
    });
  }
  h += "</div>";

  h += '<div class="card"><h3>Auto-Moderation <span style="color:#f85149">(' + (auto.pending_count||0) + ' pending)</span></h3>';
  if (autoErr) { h += '<p style="color:#f85149">' + esc(autoErr) + '</p>'; }
  else if (!auto.reports || !auto.reports.length) { h += '<p style="color:#8b949e">No reports</p>'; }
  else {
    auto.reports.forEach(function(r) {
      var sc = r.status === "pending" ? "#d29922" : "#8b949e";
      h += '<div class="card" style="border-left:3px solid ' + sc + '"><div style="display:flex;justify-content:space-between"><strong>' + esc(r.user_login) + '</strong><span style="font-size:11px;color:#8b949e">#' + r.id + " " + r.status + "</span></div>";
      h += '<div style="font-size:12px;color:#8b949e;margin:4px 0">Words: <span style="color:#f85149">' + esc(r.found_words || "") + "</span></div>";
      h += '<div style="font-size:12px;background:#0d1117;padding:6px;border-radius:4px;margin:4px 0;max-height:60px;overflow-y:auto">' + esc(r.message_text || "") + "</div>";
      if (r.status === "pending") {
        h += '<div style="margin-top:6px"><button class="btn-danger" onclick="resolveReport(' + r.id + ',\'ban\')">Ban</button> <button class="btn-warn" onclick="resolveReport(' + r.id + ',\'warn\')">Warn (' + (r.user_warn_count || 0) + '/3)</button> <button class="btn-outline" onclick="resolveReport(' + r.id + ',\'dismiss\')">Dismiss</button></div>';
      } else {
        h += '<div style="font-size:11px;color:#8b949e">Resolved: ' + esc(r.action || "?") + " by " + esc(r.resolved_by || "?") + "</div>";
      }
      h += "</div>";
    });
  }
  h += "</div>";
  p.innerHTML = h;
}

async function resolveUserReport(rid, action) {
  if (action === "ban" && !confirm("Ban the user from this report?")) return;
  msg("Working...");
  try {
    var d = await apiCall("/reports/api/resolve", "POST", { session_token: ST, report_id: rid, action: action });
    if (action === "warn" && d.warn) {
      if (d.warn.banned) msg('<span style="color:#f85149">Warn 3/3 \u2014 user banned for 3 days</span>');
      else msg('<span style="color:#d29922">Warn ' + d.warn.warn_count + '/' + d.warn.max_warns + '</span>');
    } else {
      msg('<span style="color:#238636">Report ' + action + "</span>");
    }
    loadReports();
  } catch(e) { msg('<span style="color:#f85149">' + e.message + "</span>"); }
}

async function toggleTargetMessages(rid, uid) {
  var box = document.getElementById("uevidence-" + rid);
  if (!box) return;
  if (box.style.display !== "none" && box.innerHTML) { box.style.display = "none"; return; }
  box.style.display = "block";
  box.innerHTML = "Loading...";
  try {
    var d = await apiCall("/reports/api/target-messages?session_token=" + encodeURIComponent(ST) + "&target_user_id=" + uid + "&limit=10");
    var items = d.items || [];
    if (!items.length) { box.innerHTML = '<span style="color:#8b949e;font-size:12px">No messages</span>'; return; }
    box.innerHTML = items.map(function(m) {
      return '<div style="font-size:12px;margin-bottom:6px;border-bottom:1px solid #30363d;padding-bottom:4px"><span style="color:#8b949e">' + esc(m.chat_title || ("Chat #" + m.chat_id)) + " \u00b7 " + new Date(m.created_at_ms).toLocaleString() + '</span><div style="white-space:pre-wrap">' + esc(m.body_text || "") + "</div></div>";
    }).join("");
  } catch(e) { box.innerHTML = '<span style="color:#f85149;font-size:12px">' + esc(e.message) + "</span>"; }
}

async function resolveReport(rid, action) {
  msg("Working...");
  try {
    await apiCall("/moderation/api/admin/reports/resolve", "POST", { session_token: ST, report_id: rid, action: action });
    msg('<span style="color:#238636">Report ' + action + "</span>");
    loadReports();
  } catch(e) { msg('<span style="color:#f85149">' + e.message + "</span>"); }
}

async function lookupProfile() {
  var login = document.getElementById('lookup-login').value.trim();
  if (!login) { document.getElementById('lookup-result').textContent = 'Enter a login'; return; }
  document.getElementById('lookup-result').innerHTML = 'Searching...';
  try {
    // Сначала найти user_id по логину через admin/users
    var users = await apiCall('/admin/users?session_token=' + ST + '&limit=200');
    var found = users.items.find(function(u) { return u.login.toLowerCase() === login.toLowerCase(); });
    if (!found) { document.getElementById('lookup-result').innerHTML = '<span style="color:#f85149">User not found</span>'; return; }
    var uid = found.user_id;
    var d = await apiCall('/account/api/profile/' + uid + '?session_token=' + ST);
    var pr = d.profile;
    var emojis = ['🐱','🐶','🐼','🦊','🐸','🐵','🦁','🐮','🐷','🐭','🐹','🐰','🐻','🐨','🐯'];
    var emoji = emojis[(pr.user_id||0) % emojis.length];
    var h = '<div style="text-align:center;font-size:36px;margin-bottom:4px">' + emoji + '</div>';
    h += '<h3 style="text-align:center">' + esc(pr.display_name || pr.login) + '</h3>';
    h += '<div style="text-align:center;color:#8b949e;margin-bottom:8px">@' + esc(pr.login) + ' · ' + pr.role + ' · ' + pr.status + '</div>';
    if (pr.phone) h += '<div><b>Phone:</b> ' + esc(pr.phone) + '</div>';
    if (pr.profile_bio) h += '<div style="margin-top:4px"><b>Bio:</b><br>' + esc(pr.profile_bio).replace(/\\n/g,'<br>') + '</div>';
    document.getElementById('lookup-result').innerHTML = '<div class="card" style="margin-top:8px">' + h + '</div>';
  } catch(e) { document.getElementById('lookup-result').innerHTML = '<span style="color:#f85149">' + e.message + '</span>'; }
}
