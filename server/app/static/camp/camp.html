<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Смена · Лагерь</title>
  <link rel="stylesheet" href="/static/camp/camp.css">
</head>
<body>
  <div class="camp-shell">
    <header class="camp-header">
      <div>
        <div class="eyebrow">Лагерь · рабочее место</div>
        <h1>Смена</h1>
        <p id="sessionLine" class="muted">Смена не выбрана</p>
      </div>
      <div class="header-actions">
        <span id="roleChip" class="chip">—</span>
        <button id="logoutBtn" class="button ghost hidden" type="button">Выйти</button>
      </div>
    </header>

    <section id="loginPanel" class="card login-card">
      <h2>Вход</h2>
      <p class="muted">Логин и пароль, которые выдал директор смены.</p>
      <form id="passwordForm" class="row">
        <label class="grow">Логин
          <input id="loginName" type="text" autocomplete="username" required maxlength="128">
        </label>
        <label class="grow">Пароль
          <input id="loginPassword" type="password" autocomplete="current-password" required maxlength="512">
        </label>
        <button class="button primary" type="submit">Войти</button>
      </form>
      <p id="loginError" class="error"></p>
    </section>

    <div id="workspace" class="workspace hidden">
      <nav id="nav" class="nav" aria-label="Camp sections"></nav>
      <main id="panel" class="panel" aria-live="polite"></main>
    </div>
  </div>

  <div id="toast" class="toast hidden" role="status"></div>
  <script src="/static/camp/camp.js" defer></script>
</body>
</html>
