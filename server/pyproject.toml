[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "local-chat-server"
version = "0.6.6"
description = "Server foundation for local distributed chat system"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi==0.115.6",
  "starlette==0.41.3",
  "uvicorn[standard]==0.32.1",
  "python-multipart>=0.0.9,<1.0",
  "requests>=2.31,<3.0"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8.0,<9.0"
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
