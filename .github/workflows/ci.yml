name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bash syntax (installer, CLI, scripts)
        run: |
          fail=0
          for f in $(git ls-files '*.sh'); do
            bash -n "$f" || { echo "bash syntax error: $f"; fail=1; }
          done
          exit $fail

      - name: Python syntax (compile sources)
        run: python3 -m compileall -q server/app server/setup server/scripts

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install server with test dependencies
        run: python -m pip install -e "./server[dev]"

      - name: Service unit tests
        run: python -m pytest -q tests/unit
