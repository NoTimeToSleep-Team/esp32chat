name: software-verification

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - bootstrap-local

jobs:
  software-sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install server dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./server[dev]"

      - name: Run software verification sweep
        run: python docs/tools/run_software_verification_sweep.py --with-compileall
