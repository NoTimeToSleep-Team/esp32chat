<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LC · Вариант 1 — Минимал</title>
<style>
:root{
  --bg:#0f1115;--panel:#12151a;--hover:rgba(255,255,255,.045);--line:rgba(255,255,255,.07);
  --text:#e8eaed;--muted:#9aa0a6;--accent:#7aa2f7;--accent-soft:rgba(122,162,247,.14);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,'Segoe UI',Roboto,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.app{display:flex;flex-direction:column;height:100vh}
.top{display:flex;align-items:center;gap:4px;height:52px;padding:0 14px;flex:0 0 auto}
.brand{font-weight:800;color:var(--accent);letter-spacing:.5px;margin-right:14px;font-size:15px}
.tlink{padding:6px 11px;border-radius:9px;color:var(--muted);font-size:13px}
.tlink:hover{background:var(--hover);color:var(--text)}
.tlink.on{color:var(--text);background:var(--hover)}
.top .spacer{flex:1}
.icon-btn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--muted);font-size:16px}
.icon-btn:hover{background:var(--hover);color:var(--text)}
.avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;background:#5b8def}
.cols{display:flex;flex:1;min-height:0;padding:0 10px 10px}
.list{width:280px;flex:0 0 auto;display:flex;flex-direction:column;min-height:0;padding-right:6px}
.search{margin:2px 4px 10px;padding:8px 12px;border-radius:10px;background:var(--hover);color:var(--muted);font-size:13px;display:flex;gap:8px;align-items:center}
.search input{flex:1;background:none;border:0;outline:0;color:var(--text);font:inherit}
.chats{overflow-y:auto;padding:0 4px}
.chat{padding:9px 10px;border-radius:11px;cursor:pointer;display:flex;gap:10px;align-items:center}
.chat:hover{background:var(--hover)}
.chat.on{background:var(--accent-soft)}
.chat .ava{width:34px;height:34px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;font-size:13px;font-weight:700;color:#fff}
.chat .meta{flex:1;min-width:0}
.chat .row1{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.chat .nm{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat .tm{font-size:11px;color:var(--muted);flex:0 0 auto}
.chat .pv{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.unread{min-width:18px;height:18px;border-radius:9px;background:var(--accent);color:#0f1115;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px}
.chatpane{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--panel);border-radius:14px;overflow:hidden}
.chead{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);flex:0 0 auto}
.chead .t1{font-size:14.5px;font-weight:600}
.chead .t2{font-size:12px;color:var(--muted);margin-top:1px}
.chead .spacer{flex:1}
.msgs{flex:1;overflow-y:auto;padding:18px 20px 8px}
.day{text-align:center;color:var(--muted);font-size:11.5px;margin:6px 0 16px}
.msg{display:flex;gap:10px;padding:3px 6px;border-radius:10px;position:relative}
.msg:hover{background:var(--hover)}
.msg .ava{width:28px;height:28px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;margin-top:2px}
.msg.cont .ava{visibility:hidden}
.msg .body{flex:1;min-width:0}
.msg .head{display:flex;align-items:baseline;gap:8px;margin-bottom:1px}
.msg .name{font-size:13px;font-weight:600}
.msg .name.me{color:var(--accent)}
.msg .time{font-size:11px;color:var(--muted)}
.msg .text{font-size:14.5px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.msg .more{position:absolute;right:8px;top:4px;width:26px;height:26px;border-radius:8px;display:none;place-items:center;color:var(--muted);background:var(--panel)}
.msg:hover .more{display:grid}
.msg .more:hover{color:var(--text);background:var(--hover)}
.msg .img{margin-top:6px;border-radius:12px;overflow:hidden;max-width:340px;display:block;cursor:zoom-in}
.msg .img img{display:block;width:100%;height:auto}
.file{margin-top:6px;display:inline-flex;align-items:center;gap:8px;padding:7px 10px;border-radius:10px;background:var(--hover);font-size:13px;max-width:320px;cursor:pointer}
.file:hover{background:rgba(255,255,255,.08)}
.file .fn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file .fs{color:var(--muted);font-size:11.5px;flex:0 0 auto}
.comp{flex:0 0 auto;padding:10px 14px 14px}
.pending{display:none;gap:6px;flex-wrap:wrap;padding:0 4px 8px}
.pending.show{display:flex}
.pchip{display:inline-flex;align-items:center;gap:7px;background:var(--hover);border-radius:9px;padding:5px 9px;font-size:12px;color:var(--muted)}
.pchip button:hover{color:#f87171}
.field{display:flex;align-items:flex-end;gap:6px;background:var(--hover);border-radius:22px;padding:6px 6px 6px 12px}
.field textarea{flex:1;background:none;border:0;outline:0;color:var(--text);font:inherit;resize:none;max-height:120px;padding:8px 2px;line-height:1.45}
.field textarea::placeholder{color:var(--muted)}
.round{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--muted);font-size:17px;flex:0 0 auto}
.round:hover{background:rgba(255,255,255,.08);color:var(--text)}
.round.send{background:var(--accent);color:#0f1115;font-size:15px}
.round.send:hover{filter:brightness(1.08)}
.badge{position:fixed;left:12px;bottom:12px;z-index:50;background:rgba(122,162,247,.15);color:var(--accent);border:1px solid rgba(122,162,247,.35);padding:3px 10px;border-radius:999px;font-size:11px;font-weight:600;pointer-events:none}
.back{display:none}
@media (max-width:760px){
  .list{position:fixed;inset:52px 0 0;width:100%;background:var(--bg);z-index:40;padding:8px;display:none}
  .app.show-list .list{display:flex}
  .back{display:grid}
  .cols{padding:0 6px 6px}
  .msg .img{max-width:240px}
  .badge{display:none}
}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="top">
    <span class="brand">LC</span>
    <button class="tlink on">Чат</button>
    <button class="tlink">Блог</button>
    <button class="tlink">Поддержка</button>
    <button class="tlink">Аккаунт</button>
    <span class="spacer"></span>
    <button class="icon-btn" title="Настройки">⚙</button>
    <div class="avatar">В</div>
  </div>
  <div class="cols">
    <aside class="list">
      <div class="search">🔎<input placeholder="Поиск по чатам"></div>
      <div class="chats" id="chats"></div>
    </aside>
    <section class="chatpane">
      <div class="chead">
        <button class="icon-btn back" id="back">←</button>
        <div><div class="t1" id="ctitle"></div><div class="t2" id="csub"></div></div>
        <span class="spacer"></span>
        <button class="icon-btn" title="Поиск">🔎</button>
        <button class="icon-btn" title="Ещё">⋯</button>
      </div>
      <div class="msgs" id="msgs"></div>
      <div class="comp">
        <div class="pending" id="pending">
          <span class="pchip">📄 смета.xlsx · 84 КБ <button>✕</button></span>
        </div>
        <div class="field">
          <button class="round" id="attach" title="Прикрепить файл">📎</button>
          <textarea id="input" rows="1" placeholder="Сообщение"></textarea>
          <button class="round send" id="send" title="Отправить">➤</button>
        </div>
      </div>
    </section>
  </div>
</div>
<div class="badge">Вариант 1 · Минимал</div>
<script>
const PIC="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='420'%20height='280'%3E%3Cdefs%3E%3ClinearGradient%20id='g'%20x1='0'%20y1='0'%20x2='0'%20y2='1'%3E%3Cstop%20offset='0'%20stop-color='%23ff9d6b'/%3E%3Cstop%20offset='1'%20stop-color='%232b3a67'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect%20width='420'%20height='280'%20fill='url(%23g)'/%3E%3Ccircle%20cx='320'%20cy='86'%20r='36'%20fill='%23ffe08a'/%3E%3Cpath%20d='M0%20210%20L130%20126%20L232%20210%20L312%20146%20L420%20220%20L420%20280%20L0%20280%20Z'%20fill='%231d2b4a'/%3E%3C/svg%3E";
const COLORS=["#5b8def","#e0725f","#4fb286","#b678d9","#d9a441","#5aa9c9","#c96a9b"];
function color(n){let h=0;for(const ch of n)h=(h*31+ch.charCodeAt(0))>>>0;return COLORS[h%COLORS.length]}
function initials(n){return n.trim().split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase()}
const CHATS=[
 {title:"Общий чат",sub:"24 участника · 6 онлайн",pv:"Максим: фото со смены",tm:"14:02",un:2},
 {title:"11А класс",sub:"18 участников",pv:"Аня: домашка на завтра",tm:"13:47",un:0},
 {title:"Учителя",sub:"9 участников",pv:"Ольга Ивановна: напоминаю…",tm:"12:30",un:0},
 {title:"Мария Петрова",sub:"была недавно",pv:"завтра в 10?",tm:"11:05",un:0,dm:1},
 {title:"Данил К.",sub:"был 2 ч назад",pv:"ок, скинул",tm:"вчера",un:0,dm:1}
];
const M={
 "Общий чат":[
  {n:"Максим",t:"14:02",x:"Скинул фото с сегодняшней смены, смотрите как красиво",img:1,g:1},
  {n:"Аня",t:"14:03",x:"Ого, круто! А это где?",g:1},
  {n:"Максим",t:"14:04",x:"Да на площадке у входа",g:1},
  {n:"Вы",t:"14:06",x:"Освещение классное получилось",me:1,g:1},
  {n:"Ольга Ивановна",t:"14:08",x:"Молодцы. Не забудьте про отчёт 🙌",file:["отчёт_сентябрь.pdf","1,2 МБ"],g:1},
  {n:"Максим",t:"14:09",x:"Хорошо!",g:1}
 ],
 "11А класс":[
  {n:"Аня",t:"13:40",x:"Напоминаю: завтра контрольная по алгебре",g:1},
  {n:"Кирилл",t:"13:44",x:"А какие темы?",g:1},
  {n:"Аня",t:"13:47",x:"Логарифмы и показательные уравнения",g:1}
 ],
 "Учителя":[
  {n:"Ольга Ивановна",t:"12:30",x:"Коллеги, напоминаю про планёрку в 15:00",g:1},
  {n:"Пётр Сергеевич",t:"12:35",x:"Буду",g:1}
 ],
 "Мария Петрова":[
  {n:"Мария Петрова",t:"10:58",x:"Привет! Завтра сможешь помочь с проектом?",g:1},
  {n:"Вы",t:"11:03",x:"Привет, да, после уроков",me:1,g:1},
  {n:"Мария Петрова",t:"11:05",x:"завтра в 10?",g:1}
 ],
 "Данил К.":[
  {n:"Данил К.",t:"18:20",x:"Скинь пж конспект",g:1},
  {n:"Вы",t:"18:22",x:"Держи",me:1,g:1},
  {n:"Данил К.",t:"18:25",x:"ок, скинул",g:1}
 ]
};
const $=s=>document.querySelector(s);
let current="Общий чат";
function renderList(){
  $("#chats").innerHTML="";
  CHATS.forEach(c=>{
    const d=document.createElement("div");
    d.className="chat"+(c.title===current?" on":"");
    d.innerHTML=`<div class="ava" style="background:${c.dm?"#3d4654":color(c.title)}">${c.dm?initials(c.title):initials(c.title)}</div>
      <div class="meta"><div class="row1"><span class="nm">${c.title}</span><span class="tm">${c.tm}</span></div>
      <div class="row1"><span class="pv">${c.pv}</span>${c.un?`<span class="unread">${c.un}</span>`:""}</div></div>`;
    d.onclick=()=>{current=c.title;$("#app").classList.remove("show-list");renderList();renderHead();renderMsgs()};
    $("#chats").append(d);
  });
}
function renderHead(){
  const c=CHATS.find(x=>x.title===current);
  $("#ctitle").textContent=c.title;$("#csub").textContent=c.sub;
}
function renderMsgs(){
  const box=$("#msgs");box.innerHTML='<div class="day">Сегодня</div>';
  (M[current]||[]).forEach(m=>{
    const d=document.createElement("div");
    d.className="msg"+(m.g?"":" cont");
    let html=`<div class="ava" style="background:${m.me?"#7aa2f7":color(m.n)}">${m.me?"В":initials(m.n)}</div><div class="body">`;
    if(m.g)html+=`<div class="head"><span class="name${m.me?" me":""}">${m.n}</span><span class="time">${m.t}</span></div>`;
    html+=`<div class="text">${m.x}</div>`;
    if(m.img)html+=`<span class="img"><img src="${PIC}" alt=""></span>`;
    if(m.file)html+=`<span class="file">📄<span class="fn">${m.file[0]}</span><span class="fs">${m.file[1]}</span></span>`;
    html+=`</div><button class="more" title="Ещё">⋯</button>`;
    d.innerHTML=html;
    box.append(d);
  });
  box.scrollTop=box.scrollHeight;
}
function send(){
  const inp=$("#input");const v=inp.value.trim();if(!v)return;
  const now=new Date();
  (M[current]=M[current]||[]).push({n:"Вы",t:String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0"),x:v,me:1,g:1});
  inp.value="";inp.style.height="auto";renderMsgs();
}
$("#send").onclick=send;
$("#input").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}});
$("#input").addEventListener("input",e=>{e.target.style.height="auto";e.target.style.height=Math.min(e.target.scrollHeight,120)+"px"});
$("#attach").onclick=()=>$("#pending").classList.toggle("show");
$("#back").onclick=()=>$("#app").classList.add("show-list");
renderList();renderHead();renderMsgs();
</script>
</body>
</html>
