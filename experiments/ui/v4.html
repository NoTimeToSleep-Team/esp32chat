<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LC · Вариант 4 — Мессенджер</title>
<style>
:root{
  --bg:#0e1621;--panel:#17212b;--panel2:#1d2a36;--hover:#202b36;--line:#24313d;
  --text:#f1f5f9;--muted:#7f8b98;--accent:#5eb5f7;--own:#2b5278;--own2:#2f5b85;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.45 -apple-system,'Segoe UI',Roboto,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.app{display:flex;height:100vh}
.list{width:330px;flex:0 0 auto;background:var(--panel);display:flex;flex-direction:column;min-height:0}
.lhead{padding:10px 12px}
.lrow{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.lrow .burger{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--muted);font-size:16px}
.lrow .burger:hover{background:var(--hover)}
.search{flex:1;padding:8px 12px;border-radius:18px;background:var(--bg);color:var(--muted);font-size:13px;display:flex;gap:8px;align-items:center}
.search input{flex:1;background:none;border:0;outline:0;color:var(--text);font:inherit}
.chats{flex:1;overflow-y:auto;padding:0 6px 8px}
.chat{padding:9px 10px;border-radius:12px;cursor:pointer;display:flex;gap:12px;align-items:center;position:relative}
.chat:hover{background:var(--hover)}
.chat.on{background:rgba(94,181,247,.16)}
.chat.on .nm{color:var(--accent)}
.chat.on .pv,.chat.on .tm{color:var(--muted)}
.chat.on .unread{background:var(--accent);color:#0e1621}
.chat .ava{width:48px;height:48px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;font-size:16px;font-weight:700;color:#fff}
.chat .meta{flex:1;min-width:0}
.chat .row1{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.chat .nm{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat .tm{font-size:11.5px;color:var(--muted);flex:0 0 auto}
.chat .pv{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;display:flex;gap:5px;align-items:center}
.unread{min-width:20px;height:20px;border-radius:10px;background:var(--accent);color:#0e1621;font-size:11.5px;font-weight:800;display:grid;place-items:center;padding:0 6px}
.chat.on .unread{background:#0e1621;color:#fff!important}
.main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg)}
.chead{display:flex;align-items:center;gap:11px;padding:9px 16px;background:var(--panel);flex:0 0 auto}
.chead .cava{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:700;color:#fff}
.chead .t1{font-size:14.5px;font-weight:600}
.chead .t2{font-size:12px;color:var(--accent)}
.chead .spacer{flex:1}
.icon-btn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--muted);font-size:17px}
.icon-btn:hover{background:var(--hover);color:var(--text)}
.msgs{flex:1;overflow-y:auto;padding:16px 18px 8px}
.day{text-align:center;margin:4px 0 14px}
.day span{background:rgba(0,0,0,.25);color:var(--muted);font-size:11.5px;padding:4px 12px;border-radius:999px}
.msg{display:flex;gap:10px;margin-bottom:6px;max-width:75%}
.msg.out{margin-left:auto;flex-direction:row-reverse}
.msg .ava{width:34px;height:34px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;margin-top:16px}
.bubble{background:var(--panel);border-radius:16px 16px 16px 4px;padding:7px 12px 6px;min-width:0}
.msg.out .bubble{background:var(--own);border-radius:16px 16px 4px 16px}
.who{font-size:12.5px;font-weight:700;color:var(--accent);margin-bottom:1px}
.txt{font-size:14.5px;line-height:1.42;white-space:pre-wrap;word-break:break-word}
.msg .meta{font-size:10.5px;color:var(--muted);text-align:right;margin-top:2px;display:flex;justify-content:flex-end;gap:4px;align-items:center}
.msg.out .meta{color:#a7c7e7}
.tick{font-size:11px;letter-spacing:-2px}
.pic{display:block;margin-top:5px;border-radius:12px;overflow:hidden;max-width:330px;cursor:zoom-in}
.pic img{display:block;width:100%;height:auto}
.file{margin-top:6px;display:inline-flex;align-items:center;gap:9px;background:rgba(255,255,255,.08);border-radius:10px;padding:8px 11px;font-size:13px;max-width:300px;cursor:pointer}
.file .fn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file .fs{font-size:11px;color:var(--muted);flex:0 0 auto}
.msg.out .file .fs{color:#a7c7e7}
.comp{flex:0 0 auto;padding:8px 16px 14px}
.pending{display:none;gap:6px;flex-wrap:wrap;padding-bottom:8px}
.pending.show{display:flex}
.pchip{display:inline-flex;align-items:center;gap:7px;background:var(--panel);border-radius:10px;padding:6px 10px;font-size:12px;color:var(--muted)}
.pchip button:hover{color:#f87171}
.field{display:flex;align-items:flex-end;gap:4px;background:var(--panel);border-radius:22px;padding:5px 5px 5px 8px}
.field textarea{flex:1;background:none;border:0;outline:0;color:var(--text);font:inherit;resize:none;max-height:120px;padding:9px 4px;line-height:1.4}
.field textarea::placeholder{color:var(--muted)}
.round{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--muted);font-size:18px;flex:0 0 auto}
.round:hover{background:var(--hover);color:var(--text)}
.round.send{background:var(--accent);color:#0e1621;font-size:16px;display:none}
.round.send.on{display:grid}
.round.mic{display:grid}
.round.mic.off{display:none}
.badge{position:fixed;left:12px;bottom:12px;z-index:50;background:rgba(94,181,247,.15);color:var(--accent);border:1px solid rgba(94,181,247,.3);padding:3px 10px;border-radius:999px;font-size:11px;font-weight:600;pointer-events:none}
.back{display:none}
@media (max-width:820px){
  .list{position:fixed;inset:0;width:100%;z-index:40;display:none}
  .app.show-list .list{display:flex}
  .back{display:grid}
  .msg{max-width:88%}
  .pic{max-width:230px}
  .badge{display:none}
}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="list">
    <div class="lhead">
      <div class="lrow">
        <button class="burger" title="Меню">☰</button>
        <div class="search">🔎<input placeholder="Поиск"></div>
      </div>
    </div>
    <div class="chats" id="chats"></div>
  </aside>
  <section class="main">
    <div class="chead">
      <button class="icon-btn back" id="back">←</button>
      <div class="cava" id="cava"></div>
      <div><div class="t1" id="ctitle"></div><div class="t2" id="csub"></div></div>
      <span class="spacer"></span>
      <button class="icon-btn" title="Поиск">🔎</button>
      <button class="icon-btn" title="Ещё">⋮</button>
    </div>
    <div class="msgs" id="msgs"></div>
    <div class="comp">
      <div class="pending" id="pending"><span class="pchip">📄 смета.xlsx · 84 КБ <button>✕</button></span></div>
      <div class="field">
        <button class="round" id="emoji" title="Эмодзи">😊</button>
        <button class="round" id="attach" title="Прикрепить">📎</button>
        <textarea id="input" rows="1" placeholder="Сообщение"></textarea>
        <button class="round mic" id="mic" title="Голосовое">🎤</button>
        <button class="round send" id="send" title="Отправить">➤</button>
      </div>
    </div>
  </section>
</div>
<div class="badge">Вариант 4 · Мессенджер</div>
<script>
const PIC="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='420'%20height='280'%3E%3Cdefs%3E%3ClinearGradient%20id='g'%20x1='0'%20y1='0'%20x2='0'%20y2='1'%3E%3Cstop%20offset='0'%20stop-color='%23ff9d6b'/%3E%3Cstop%20offset='1'%20stop-color='%232b3a67'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect%20width='420'%20height='280'%20fill='url(%23g)'/%3E%3Ccircle%20cx='320'%20cy='86'%20r='36'%20fill='%23ffe08a'/%3E%3Cpath%20d='M0%20210%20L130%20126%20L232%20210%20L312%20146%20L420%20220%20L420%20280%20L0%20280%20Z'%20fill='%231d2b4a'/%3E%3C/svg%3E";
const COLORS=["#e17076","#7bc862","#e5ca77","#a695e7","#6ec9cb","#ee7aae","#65aadd"];
function color(n){let h=0;for(const ch of n)h=(h*31+ch.charCodeAt(0))>>>0;return COLORS[h%COLORS.length]}
function initials(n){return n.trim().split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase()}
const CHATS=[
 {title:"Общий чат",sub:"был(а) недавно",pv:"Максим: фото со смены",tm:"14:02",un:2},
 {title:"11А класс",sub:"18 участников",pv:"Аня: домашка на завтра",tm:"13:47",un:0},
 {title:"Учителя",sub:"9 участников",pv:"Ольга Ивановна: напоминаю…",tm:"12:30",un:0},
 {title:"Мария Петрова",sub:"была недавно",pv:"завтра в 10?",tm:"11:05",un:0,dm:1},
 {title:"Данил К.",sub:"был 2 ч назад",pv:"ок, скинул",tm:"вчера",un:0,dm:1}
];
const M={
 "Общий чат":[
  {n:"Максим",t:"14:02",x:"Скинул фото с сегодняшней смены, смотрите как красиво",img:1},
  {n:"Аня",t:"14:03",x:"Ого, круто! А это где?"},
  {n:"Максим",t:"14:04",x:"Да на площадке у входа"},
  {n:"Вы",t:"14:06",x:"Освещение классное получилось",me:1},
  {n:"Ольга Ивановна",t:"14:08",x:"Молодцы. Не забудьте про отчёт 🙌",file:["отчёт_сентябрь.pdf","1,2 МБ"]},
  {n:"Максим",t:"14:09",x:"Хорошо!"}
 ],
 "11А класс":[
  {n:"Аня",t:"13:40",x:"Напоминаю: завтра контрольная по алгебре"},
  {n:"Кирилл",t:"13:44",x:"А какие темы?"},
  {n:"Аня",t:"13:47",x:"Логарифмы и показательные уравнения"}
 ],
 "Учителя":[
  {n:"Ольга Ивановна",t:"12:30",x:"Коллеги, напоминаю про планёрку в 15:00"},
  {n:"Пётр Сергеевич",t:"12:35",x:"Буду"}
 ],
 "Мария Петрова":[
  {n:"Мария Петрова",t:"10:58",x:"Привет! Завтра сможешь помочь с проектом?"},
  {n:"Вы",t:"11:03",x:"Привет, да, после уроков",me:1},
  {n:"Мария Петрова",t:"11:05",x:"завтра в 10?"}
 ],
 "Данил К.":[
  {n:"Данил К.",t:"18:20",x:"Скинь пж конспект"},
  {n:"Вы",t:"18:22",x:"Держи",me:1},
  {n:"Данил К.",t:"18:25",x:"ок, скинул"}
 ]
};
const $=s=>document.querySelector(s);
let current="Общий чат";
function renderList(){
  $("#chats").innerHTML="";
  CHATS.forEach(c=>{
    const d=document.createElement("div");
    d.className="chat"+(c.title===current?" on":"");
    d.innerHTML=`<div class="ava" style="background:${c.dm?"#7f8b98":color(c.title)}">${initials(c.title)}</div>
      <div class="meta"><div class="row1"><span class="nm">${c.title}</span><span class="tm">${c.tm}</span></div>
      <div class="row1"><span class="pv">${c.dm?"":""}${c.pv}</span>${c.un?`<span class="unread">${c.un}</span>`:""}</div></div>`;
    d.onclick=()=>{current=c.title;$("#app").classList.remove("show-list");renderList();renderHead();renderMsgs()};
    $("#chats").append(d);
  });
}
function renderHead(){
  const c=CHATS.find(x=>x.title===current);
  $("#ctitle").textContent=c.title;$("#csub").textContent=c.dm?c.sub:(c.sub+" · 6 онлайн");
  $("#cava").textContent=initials(c.title);$("#cava").style.background=c.dm?"#7f8b98":color(c.title);
}
function renderMsgs(){
  const box=$("#msgs");box.innerHTML='<div class="day"><span>Сегодня</span></div>';
  (M[current]||[]).forEach(m=>{
    const d=document.createElement("div");
    d.className="msg"+(m.me?" out":"");
    let html=`<div class="ava" style="background:${m.me?"#2b5278":color(m.n)}">${m.me?"В":initials(m.n)}</div><div class="bubble">`;
    if(!m.me)html+=`<div class="who">${m.n}</div>`;
    html+=`<div class="txt">${m.x}</div>`;
    if(m.img)html+=`<span class="pic"><img src="${PIC}" alt=""></span>`;
    if(m.file)html+=`<span class="file">📄<span class="fn">${m.file[0]}</span><span class="fs">${m.file[1]}</span></span>`;
    html+=`<div class="meta">${m.t}${m.me?' <span class="tick">✓✓</span>':""}</div></div>`;
    d.innerHTML=html;
    box.append(d);
  });
  box.scrollTop=box.scrollHeight;
}
function syncComposer(){
  const has=$("#input").value.trim().length>0;
  $("#send").classList.toggle("on",has);
  $("#mic").classList.toggle("off",has);
}
function send(){
  const inp=$("#input");const v=inp.value.trim();if(!v)return;
  const now=new Date();
  (M[current]=M[current]||[]).push({n:"Вы",t:String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0"),x:v,me:1});
  inp.value="";inp.style.height="auto";syncComposer();renderMsgs();
}
$("#send").onclick=send;
$("#input").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}});
$("#input").addEventListener("input",e=>{e.target.style.height="auto";e.target.style.height=Math.min(e.target.scrollHeight,120)+"px";syncComposer()});
$("#attach").onclick=()=>$("#pending").classList.toggle("show");
$("#back").onclick=()=>$("#app").classList.add("show-list");
renderList();renderHead();renderMsgs();syncComposer();
</script>
</body>
</html>
