<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LC · Вариант 3 — Компакт</title>
<style>
:root{
  --bg:#0b0d10;--panel:#101318;--hover:rgba(255,255,255,.04);--line:rgba(255,255,255,.06);
  --text:#dde1e7;--muted:#7d8590;--accent:#6ea8fe;--accent-soft:rgba(110,168,254,.12);
  --ok:#3fb950;--warn:#d29922;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:13px/1.45 -apple-system,'Segoe UI',Roboto,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.app{display:flex;height:100vh}
.rail{width:52px;flex:0 0 auto;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:10px 0;gap:6px}
.rail .logo{font-weight:800;color:var(--accent);font-size:13px;margin-bottom:8px}
.ricon{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--muted);font-size:16px}
.ricon:hover{background:var(--hover);color:var(--text)}
.ricon.on{background:var(--accent-soft);color:var(--accent)}
.rail .spacer{flex:1}
.rail .me{width:30px;height:30px;border-radius:50%;background:#4a5468;color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700}
.list{width:300px;flex:0 0 auto;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--bg)}
.lhead{padding:12px 12px 8px}
.ltitle{font-size:13px;font-weight:700;letter-spacing:.3px;margin-bottom:9px;display:flex;align-items:center;gap:8px}
.ltitle .spacer{flex:1}
.search{padding:7px 10px;border-radius:8px;background:var(--hover);color:var(--muted);font-size:12.5px;display:flex;gap:7px;align-items:center}
.search input{flex:1;background:none;border:0;outline:0;color:var(--text);font:inherit}
.chats{overflow-y:auto;padding:0 6px 8px}
.chat{padding:7px 8px;border-radius:9px;cursor:pointer;display:flex;gap:9px;align-items:center;position:relative}
.chat:hover{background:var(--hover)}
.chat.on{background:var(--accent-soft)}
.chat .ava{width:30px;height:30px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff}
.chat .meta{flex:1;min-width:0}
.chat .row1{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.chat .nm{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat .tm{font-size:10.5px;color:var(--muted);flex:0 0 auto}
.chat .pv{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.unread{min-width:17px;height:17px;border-radius:9px;background:var(--accent);color:#0b0d10;font-size:10.5px;font-weight:800;display:grid;place-items:center;padding:0 5px}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.chead{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line);flex:0 0 auto}
.chead .t1{font-size:13px;font-weight:700}
.chead .t2{font-size:11.5px;color:var(--muted)}
.chead .spacer{flex:1}
.chead .chip{font-size:10.5px;color:var(--muted);background:var(--hover);padding:3px 8px;border-radius:999px}
.msgs{flex:1;overflow-y:auto;padding:10px 6px 6px}
.day{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:10.5px;margin:8px 8px 10px}
.day:before,.day:after{content:"";height:1px;background:var(--line);flex:1}
.row{display:flex;gap:9px;padding:2px 8px;border-radius:7px;position:relative;align-items:flex-start}
.row:hover{background:var(--hover)}
.row .t{width:38px;flex:0 0 auto;color:var(--muted);font-size:10.5px;padding-top:2px;text-align:right;font-variant-numeric:tabular-nums}
.row .ava{width:26px;height:26px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;font-size:10px;font-weight:700;color:#fff;margin-top:1px}
.row .c{flex:1;min-width:0}
.row .hd{display:flex;align-items:baseline;gap:8px}
.row .nm{font-size:12px;font-weight:700}
.row .nm.me{color:var(--accent)}
.row .tx{font-size:13px;white-space:pre-wrap;word-break:break-word;margin-top:1px}
.row.cont .t,.row.cont .ava{visibility:hidden}
.row.cont{padding-top:1px;padding-bottom:1px}
.row .acts{position:absolute;right:8px;top:1px;display:none;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:2px}
.row:hover .acts{display:flex}
.acts button{font-size:11px;color:var(--muted);padding:3px 7px;border-radius:6px}
.acts button:hover{background:var(--hover);color:var(--text)}
.pic{display:inline-block;margin-top:5px;border-radius:9px;overflow:hidden;max-width:300px;cursor:zoom-in;border:1px solid var(--line)}
.pic img{display:block;width:100%;height:auto}
.file{margin-top:5px;display:inline-flex;align-items:center;gap:8px;background:var(--hover);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:12px;max-width:300px;cursor:pointer}
.file .fn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file .fs{font-size:10.5px;color:var(--muted);flex:0 0 auto}
.comp{flex:0 0 auto;border-top:1px solid var(--line);padding:9px 12px}
.pending{display:none;gap:6px;flex-wrap:wrap;padding-bottom:8px}
.pending.show{display:flex}
.pchip{display:inline-flex;align-items:center;gap:7px;background:var(--hover);border:1px solid var(--line);border-radius:7px;padding:4px 8px;font-size:11.5px;color:var(--muted)}
.pchip button:hover{color:#f87171}
.field{display:flex;align-items:flex-end;gap:4px;background:var(--hover);border:1px solid var(--line);border-radius:9px;padding:4px 4px 4px 8px}
.field:focus-within{border-color:rgba(110,168,254,.4)}
.field textarea{flex:1;background:none;border:0;outline:0;color:var(--text);font:inherit;resize:none;max-height:110px;padding:6px 2px;line-height:1.45}
.field textarea::placeholder{color:var(--muted)}
.fbtn{height:30px;padding:0 10px;border-radius:7px;color:var(--muted);font-size:13px;display:grid;place-items:center}
.fbtn:hover{background:var(--hover);color:var(--text)}
.fbtn.send{background:var(--accent);color:#0b0d10;font-weight:700;font-size:12px;padding:0 14px}
.fbtn.send:hover{filter:brightness(1.07)}
.hint{font-size:10.5px;color:var(--muted);margin-top:6px;display:flex;gap:12px}
.badge{position:fixed;left:64px;bottom:12px;z-index:50;background:rgba(110,168,254,.12);color:var(--accent);border:1px solid rgba(110,168,254,.3);padding:2px 9px;border-radius:999px;font-size:10.5px;font-weight:600;pointer-events:none}
@media (max-width:860px){.list{display:none}.app.show-list .list{display:flex;position:fixed;inset:0;width:100%;z-index:40}.back{display:grid!important}.badge{display:none}}
.back{display:none}
</style>
</head>
<body>
<div class="app" id="app">
  <nav class="rail">
    <div class="logo">LC</div>
    <button class="ricon on" title="Чат">💬</button>
    <button class="ricon" title="Блог">📰</button>
    <button class="ricon" title="Поддержка">🎫</button>
    <button class="ricon" title="Аккаунт">👤</button>
    <span class="spacer"></span>
    <button class="ricon" title="Выйти">⏻</button>
    <div class="me">В</div>
  </nav>
  <aside class="list">
    <div class="lhead">
      <div class="ltitle">Чаты <span class="spacer"></span><button class="ricon" style="width:26px;height:26px;font-size:14px" title="Новый чат">＋</button></div>
      <div class="search">🔎<input placeholder="Поиск"></div>
    </div>
    <div class="chats" id="chats"></div>
  </aside>
  <section class="main">
    <div class="chead">
      <button class="ricon back" id="back" style="width:28px;height:28px;font-size:14px">←</button>
      <div><div class="t1" id="ctitle"></div><div class="t2" id="csub"></div></div>
      <span class="spacer"></span>
      <span class="chip" id="ccount"></span>
      <button class="ricon" style="width:30px;height:30px" title="Поиск">🔎</button>
      <button class="ricon" style="width:30px;height:30px" title="Ещё">⋯</button>
    </div>
    <div class="msgs" id="msgs"></div>
    <div class="comp">
      <div class="pending" id="pending"><span class="pchip">📄 смета.xlsx · 84 КБ <button>✕</button></span></div>
      <div class="field">
        <button class="fbtn" id="attach" title="Прикрепить">📎</button>
        <textarea id="input" rows="1" placeholder="Сообщение"></textarea>
        <button class="fbtn send" id="send">Отправить</button>
      </div>
      <div class="hint"><span>Enter — отправить</span><span>Shift+Enter — новая строка</span><span>до 8 файлов · до 10 МБ</span></div>
    </div>
  </section>
</div>
<div class="badge">Вариант 3 · Компакт</div>
<script>
const PIC="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='420'%20height='280'%3E%3Cdefs%3E%3ClinearGradient%20id='g'%20x1='0'%20y1='0'%20x2='0'%20y2='1'%3E%3Cstop%20offset='0'%20stop-color='%23ff9d6b'/%3E%3Cstop%20offset='1'%20stop-color='%232b3a67'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect%20width='420'%20height='280'%20fill='url(%23g)'/%3E%3Ccircle%20cx='320'%20cy='86'%20r='36'%20fill='%23ffe08a'/%3E%3Cpath%20d='M0%20210%20L130%20126%20L232%20210%20L312%20146%20L420%20220%20L420%20280%20L0%20280%20Z'%20fill='%231d2b4a'/%3E%3C/svg%3E";
const COLORS=["#5b8def","#e0725f","#4fb286","#b678d9","#d9a441","#5aa9c9","#c96a9b"];
function color(n){let h=0;for(const ch of n)h=(h*31+ch.charCodeAt(0))>>>0;return COLORS[h%COLORS.length]}
function initials(n){return n.trim().split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase()}
const CHATS=[
 {title:"Общий чат",sub:"24 участника",pv:"Максим: фото со смены",tm:"14:02",un:2},
 {title:"11А класс",sub:"18 участников",pv:"Аня: домашка на завтра",tm:"13:47",un:0},
 {title:"Учителя",sub:"9 участников",pv:"Ольга Ивановна: напоминаю…",tm:"12:30",un:0},
 {title:"Мария Петрова",sub:"была недавно",pv:"завтра в 10?",tm:"11:05",un:0,dm:1},
 {title:"Данил К.",sub:"был 2 ч назад",pv:"ок, скинул",tm:"вчера",un:0,dm:1}
];
const M={
 "Общий чат":[
  {n:"Максим",t:"14:02",x:"Скинул фото с сегодняшней смены, смотрите как красиво",img:1,g:1},
  {n:"Аня",t:"14:03",x:"Ого, круто! А это где?",g:1},
  {n:"Максим",t:"14:04",x:"Да на площадке у входа",g:1},
  {n:"Вы",t:"14:06",x:"Освещение классное получилось",me:1,g:1},
  {n:"Ольга Ивановна",t:"14:08",x:"Молодцы. Не забудьте про отчёт 🙌",file:["отчёт_сентябрь.pdf","1,2 МБ"],g:1},
  {n:"Максим",t:"14:09",x:"Хорошо!",g:1}
 ],
 "11А класс":[
  {n:"Аня",t:"13:40",x:"Напоминаю: завтра контрольная по алгебре",g:1},
  {n:"Кирилл",t:"13:44",x:"А какие темы?",g:1},
  {n:"Аня",t:"13:47",x:"Логарифмы и показательные уравнения",g:1}
 ],
 "Учителя":[
  {n:"Ольга Ивановна",t:"12:30",x:"Коллеги, напоминаю про планёрку в 15:00",g:1},
  {n:"Пётр Сергеевич",t:"12:35",x:"Буду",g:1}
 ],
 "Мария Петрова":[
  {n:"Мария Петрова",t:"10:58",x:"Привет! Завтра сможешь помочь с проектом?",g:1},
  {n:"Вы",t:"11:03",x:"Привет, да, после уроков",me:1,g:1},
  {n:"Мария Петрова",t:"11:05",x:"завтра в 10?",g:1}
 ],
 "Данил К.":[
  {n:"Данил К.",t:"18:20",x:"Скинь пж конспект",g:1},
  {n:"Вы",t:"18:22",x:"Держи",me:1,g:1},
  {n:"Данил К.",t:"18:25",x:"ок, скинул",g:1}
 ]
};
const $=s=>document.querySelector(s);
let current="Общий чат";
function renderList(){
  $("#chats").innerHTML="";
  CHATS.forEach(c=>{
    const d=document.createElement("div");
    d.className="chat"+(c.title===current?" on":"");
    d.innerHTML=`<div class="ava" style="background:${c.dm?"#3d4654":color(c.title)}">${initials(c.title)}</div>
      <div class="meta"><div class="row1"><span class="nm">${c.title}</span><span class="tm">${c.tm}</span></div>
      <div class="row1"><span class="pv">${c.pv}</span>${c.un?`<span class="unread">${c.un}</span>`:""}</div></div>`;
    d.onclick=()=>{current=c.title;$("#app").classList.remove("show-list");renderList();renderHead();renderMsgs()};
    $("#chats").append(d);
  });
}
function renderHead(){
  const c=CHATS.find(x=>x.title===current);
  $("#ctitle").textContent=c.title;$("#csub").textContent=c.sub;
  $("#ccount").textContent=(M[current]||[]).length+" сообщ.";
}
function renderMsgs(){
  const box=$("#msgs");box.innerHTML='<div class="day">Сегодня</div>';
  (M[current]||[]).forEach(m=>{
    const d=document.createElement("div");
    d.className="row"+(m.g?"":" cont");
    let html=`<div class="t">${m.g?m.t:""}</div><div class="ava" style="background:${m.me?"#6ea8fe":color(m.n)}">${m.me?"В":initials(m.n)}</div><div class="c">`;
    if(m.g)html+=`<div class="hd"><span class="nm${m.me?" me":""}">${m.n}</span></div>`;
    html+=`<div class="tx">${m.x}</div>`;
    if(m.img)html+=`<span class="pic"><img src="${PIC}" alt=""></span>`;
    if(m.file)html+=`<span class="file">📄<span class="fn">${m.file[0]}</span><span class="fs">${m.file[1]}</span></span>`;
    html+=`</div><div class="acts"><button>↩ Ответить</button><button>⚑ Жалоба</button></div>`;
    d.innerHTML=html;
    box.append(d);
  });
  box.scrollTop=box.scrollHeight;
}
function send(){
  const inp=$("#input");const v=inp.value.trim();if(!v)return;
  const now=new Date();
  (M[current]=M[current]||[]).push({n:"Вы",t:String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0"),x:v,me:1,g:1});
  inp.value="";inp.style.height="auto";renderMsgs();renderHead();
}
$("#send").onclick=send;
$("#input").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}});
$("#input").addEventListener("input",e=>{e.target.style.height="auto";e.target.style.height=Math.min(e.target.scrollHeight,110)+"px"});
$("#attach").onclick=()=>$("#pending").classList.toggle("show");
$("#back").onclick=()=>$("#app").classList.add("show-list");
renderList();renderHead();renderMsgs();
</script>
</body>
</html>
